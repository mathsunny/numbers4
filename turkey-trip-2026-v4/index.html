<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6652a3"><meta http-equiv="Cache-Control" content="no-store"><title>튀르키예 13일 실사용 일정 v4</title><style>:root{--p:#6652a3;--bg:#f5f5f8;--ink:#25222d;--muted:#77717e;--line:#e6e2ea;--blue:#2878ee;--orange:#b85f2b;--green:#30794a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;padding-bottom:82px}.app{max-width:760px;margin:auto}.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#57418f,#7f69bd);color:white;padding:14px 16px}.top h1{font-size:20px;margin:0}.top p{font-size:12px;margin:4px 0 0;opacity:.9}.wrap{padding:14px}.view{display:none}.view.on{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 5px 18px #493a760d}.hero{background:linear-gradient(135deg,#fff,#eee9fb)}.section{font-size:21px;font-weight:900;margin:22px 2px 10px}.ey{color:var(--p);font-size:12px;font-weight:900}.big{font-size:24px;font-weight:900;margin:4px 0}.title{font-size:17px;font-weight:900;margin:4px 0}.sub{font-size:13px;line-height:1.55;color:var(--muted)}.time{font-size:13px;font-weight:900;color:var(--blue)}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:900;margin-right:4px}.must{background:#fff0e8;color:#b2582c}.rec{background:#eeeeef;color:#68636d}.book{background:#eee8fc;color:#6550a4}.pick{background:#fff1d7;color:#8c6117}.outfit{background:#eaf7ee;color:#34744a}.src{background:#edf4ff;color:#3566a9}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.btn,a.btn{border:0;text-decoration:none;text-align:center;padding:10px 6px;border-radius:11px;background:#eef1f5;color:#333;font-size:12px;font-weight:850;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.purple{background:var(--p);color:#fff}.btn.good{background:#e9f6eb;color:#337a47}.btn.orange{background:#fff0df;color:#985b18}.item.done{opacity:.5}.item.done .title{text-decoration:line-through}.note{margin-top:8px;background:#f8f7fb;border-radius:11px;padding:9px 10px;font-size:12px;line-height:1.5}.warn{border:2px solid #eda26e;background:#fffaf3}.route{border-left:4px solid #7aa8e8}.meal{border-left:4px solid #db9e64}.hotel{border-left:4px solid #c2b3ed}.tour{border-left:4px solid #dc8f6c}.transport{border-left:4px solid #72b6a6}.tabs,.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.tabs button,.filters button{white-space:nowrap;border:1px solid #ddd7e8;background:#fff;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:850}.tabs .on,.filters .on{background:var(--p);border-color:var(--p);color:#fff}.check{display:flex;gap:9px;padding:10px 0;border-top:1px solid #f0edf2}.check:first-child{border-top:0}.check input{width:19px;height:19px;accent-color:var(--p)}.check.done{opacity:.5;text-decoration:line-through}.shop{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #f0edf2}.star{border:0;background:transparent;font-size:22px}.buy{border:0;background:#eee9fb;color:var(--p);font-weight:850;border-radius:9px;padding:7px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid #e5e1eb;display:grid;grid-template-columns:repeat(5,1fr)}.bottom button{border:0;background:#fff;color:#6c6673;padding:9px 2px 7px;font-size:11px}.bottom button.on{color:var(--p);font-weight:900}.bottom span{display:block;font-size:20px}.fab{position:fixed;right:16px;bottom:82px;z-index:35;border:0;border-radius:999px;background:var(--p);color:white;padding:12px 15px;font-weight:900;box-shadow:0 6px 18px #523d8f55}.modal{position:fixed;inset:0;background:#18131d80;display:none;align-items:flex-end;z-index:60}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;padding:16px 16px 24px;max-height:87vh;overflow:auto}.close{float:right;border:0;background:#eeeaf3;width:34px;height:34px;border-radius:999px;font-size:18px}.phrase{border-top:1px solid #eee;padding:12px 0}.phrase:first-child{border-top:0}.phrase .en{font-weight:800}.phrase .tr{color:#5f4b91;margin-top:4px}.small{font-size:11px;color:var(--muted)}@media(min-width:700px){.wrap{padding:20px}.bottom{left:50%;transform:translateX(-50%);max-width:760px}.fab{right:calc(50% - 360px)}}</style></head><body><div class="app"><header class="top"><h1>튀르키예 13일 🇹🇷</h1><p>2026.08.10–08.22 · 실사용판 v4</p></header><main class="wrap"><section id="today" class="view on"></section><section id="schedule" class="view"></section><section id="transport" class="view"></section><section id="check" class="view"></section><section id="tools" class="view"></section></main></div><button class="fab" onclick="openExpense()">＋ 지출</button><nav class="bottom"><button class="on" data-v="today"><span>☀️</span>오늘</button><button data-v="schedule"><span>🗓️</span>일정</button><button data-v="transport"><span>🧭</span>이동·투어</button><button data-v="check"><span>✅</span>체크·쇼핑</button><button data-v="tools"><span>🧰</span>여행도구</button></nav><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="sheet" class="sheet"></div></div><script>const N1='JANG YUN SUN',N2='SONG JI MIN';const S=JSON.parse(localStorage.getItem('tr26v4')||'{"done":{},"checks":{},"shop":{},"expenses":[]}');function save(){localStorage.setItem('tr26v4',JSON.stringify(S))}const E=s=>encodeURIComponent(s||''),esc=s=>String(s).replaceAll('\\','\\\\').replaceAll("'","\\'");const H={isg:'ISG Airport Hotel',bel:'Belcehan Delux Hotel',tuv:'Tuvana',aren:'Aren Cave Goreme',shine:'Shining Star'};const D={isg:'Sanayi, Sabiha Gökçen Havaalanı, Pendik/İstanbul',bel:'Belcehan Delux Hotel, Ölüdeniz, Fethiye',tuv:'Tuvana Hotel, Kaleiçi, Antalya',aren:'Aren Cave Goreme',shine:'Shining Star Hotel Istanbul'};function gmap(dest,origin='',mode='transit'){return `https://www.google.com/maps/dir/?api=1${origin?'&origin='+E(origin):''}&destination=${E(dest)}&travelmode=${mode}`}function search(dest){return `https://www.google.com/maps/search/?api=1&query=${E(dest)}`}function say(t,l='en-US'){let u=new SpeechSynthesisUtterance(t);u.lang=l;speechSynthesis.cancel();speechSynthesis.speak(u)}function phraseButton(en,tr=''){return `<div class="note"><b>리셉션 요청 표현</b><div class="phrase"><div class="en">${en}</div>${tr?`<div class="tr">${tr}</div>`:''}<div class="buttons"><button class="btn purple" onclick="say('${esc(en)}','en-US')">🔊 영어 듣기</button>${tr?`<button class="btn" onclick="say('${esc(tr)}','tr-TR')">🔊 터키어 듣기</button>`:''}<button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(en)}')">복사</button></div></div></div>`}function outfit(t){return t?`<div class="note"><span class="badge outfit">👕 추천복장</span> ${t}</div>`:''}function card(day,time,title,dest,desc,kind='route',must=true,cloth='',origin='',extra=''){let k=day+'|'+time+'|'+title,d=S.done[k];return `<div class="card item ${kind} ${d?'done':''}">${must?'<span class="badge must">❗필수</span>':'<span class="badge rec">⭐추천</span>'}<span class="time">${time}</span><div class="title">${title}</div><div class="sub">${desc}</div>${outfit(cloth)}${extra}<div class="buttons"><a class="btn primary" target="_blank" href="${gmap(dest,origin)}">🗺️ 길찾기</a><a class="btn" target="_blank" href="${search(dest)}">📍 장소보기</a><button class="btn good" onclick="toggle('${esc(k)}')">${d?'✓ 완료':'✅ 완료'}</button></div></div>`}function toggle(k){S.done[k]=!S.done[k];save();render()}function meeting(day,time,name,place,desc,cloth='',src=''){return card(day,time,name,place,desc,'tour',true,cloth,'',`<div class="note"><span class="badge pick">📌 미팅장소</span> ${place}</div>${src?`<div class="note"><span class="badge src">자료 기준</span> ${src}</div>`:''}`)}const days={};days['8/10']=()=>`<div class="card hero"><div class="ey">8/10 · 이스탄불 도착</div><div class="big">IST → SAW → ISG</div><div class="sub">스캔 일정의 이동방식을 짧게 따라가기 좋게 정리했습니다.</div></div>${card('8/10','13:40–19:40','KE955 인천 → Istanbul Airport','Istanbul Airport','19:40 도착 후 입국심사 → 위탁수하물 수령.','route',true,'기내 냉방 대비 얇은 겉옷')}${card('8/10','입국 후','IST → SAW : Havaist(Hvist) 13','Sabiha Gokcen International Airport','이스탄불 신공항에서 사비하 괵첸공항행 직행 유료셔틀. 여행사 자료 기준 약 1시간30분, 신용카드 결제 가능.','transport',true,'밤 이동용 편한 운동화','Istanbul Airport',`<div class="note"><b>간략 이동</b><br>① 입국·수하물 수령 → ② Havaist/Hvist 안내 따라 공항버스 승차장 → ③ <b>13번 SAW행</b> 탑승 → ④ Sabiha Gökçen Airport 하차</div>`)}${card('8/10','SAW 도착 후','SAW → ISG Airport Hotel 도보','ISG Airport Hotel','여행사 자료에는 공항 도착 후 호텔까지 도보 약 15분으로 안내되어 있습니다. 아래 도보 버튼을 누르면 Google Maps가 현재 위치에서 길을 잡습니다.','hotel',true,'캐리어 끌기 편한 신발','Sabiha Gokcen International Airport',`<div class="buttons"><a class="btn primary" target="_blank" href="${gmap('ISG Airport Hotel','Sabiha Gokcen International Airport','walking')}">🚶 ISG 도보 경로</a><a class="btn" target="_blank" href="${search('ISG Airport Hotel')}">🏨 호텔 위치</a><span></span></div>`)}`;days['8/11']=()=>`<div class="card hero"><div class="ey">8/11 · SAW → 달라만</div><div class="big">07:10 호텔 출발</div><div class="sub">09:00 비행기라 07:30까지 공항 도착을 목표로 잡았습니다.</div></div>${card('8/11','07:00','기상·짐 최종 확인',D.isg,'체크아웃 준비. 여권·PC2286 PNR 25YK6Y·수하물 확인.','hotel',true,'편한 이동복')}${card('8/11','07:10','ISG Airport Hotel 체크아웃 → SAW 도보 출발','Sabiha Gokcen International Airport','호텔에서 늦어도 07:10 출발 → 도보 약 15분 + 입구 찾기 여유 5분 → 07:30 전후 공항 도착 목표.','transport',true,'운동화',D.isg,`<div class="buttons"><a class="btn primary" target="_blank" href="${gmap('Sabiha Gokcen International Airport',D.isg,'walking')}">🚶 공항 도보경로</a><span></span><span></span></div>`)}${card('8/11','07:30','SAW 도착·보딩/수하물','Sabiha Gokcen International Airport','출발 1시간30분 전 도착 기준. PC2286 09:00 출발.','route',true,'공항 냉방용 얇은 겉옷')}${card('8/11','09:00–10:15','PC2286 essionStorage.getItem('day')||'8/10';sessionStorage.setItem('day',d);document.getElementById('schedule').innerHTML=`<div class="card hero"><div class="ey">전체 일정</div><div class="big">날짜별 실사용 일정</div></div><div class="tabs">${list.map(x=>`<button class="${x===d?'on':''}" onclick="schedule('${x}')">${x}</button>`).join('')}</div>${days[d]()}`}function transport(){let meetings=[['8/12 08:00','지프사파리+사클르켄트',D.bel],['8/13 09:40','FLY LAPUTA 패러글라이딩','FLY LAPUTA PARAGLIDING Ölüdeniz'],['8/14 08:00 선택투어','래프팅·집라인·지프·쿼드·버기',D.tuv],['8/16 04:15~04:30','열기구 픽업',D.aren],['8/16 10:00','그린투어','Göreme Otogar Metro Turizm'],['8/17 17:30','ATV 선셋투어',D.aren],['8/19 현재 10:00','이스탄불 오전 반일투어','German Fountain Istanbul'],['8/19 현재 16:00','이스탄불 미식투어','Karaköy Pier']];document.getElementById('transport').innerHTML=`<div class="card hero"><div class="ey">이동·투어</div><div class="big">미팅장소 바로 찾기</div></div><div class="section">픽업 이름</div><div class="card"><div class="title">👤 ${N1}</div><div class="sub">동행자: ${N2}<br>SAW 픽업은 <b>G55 로고 + ${N1}</b> 확인.</div></div><div class="section">투어 미팅장소</div>${meetings.map(m=>`<div class="card tour"><span class="time">${m[0]}</span><div class="title">${m[1]}</div><div class="sub">${m[2]}</div><div class="buttons"><a class="btn primary" target="_blank" href="${gmap(m[2])}">🗺️ 길찾기</a><a class="btn" target="_blank" href="${search(m[2])}">📍 장소보기</a><span></span></div></div>`).join('')}<div class="section">공항·호텔</div>${card('8/10','도착 후','IST → SAW Havaist 13','Sabiha Gokcen International Airport','직행 유료셔틀 · 약 1시간30분 · 신용카드 가능.','transport',true,'','Istanbul Airport')}${card('8/10','SAW 도착 후','SAW → ISG Airport Hotel 도보','ISG Airport Hotel','약 15분.','hotel',true,'','Sabiha Gokcen International Airport')}`}function check(tab='packing'){document.getElementById('check').innerHTML=`<div class="card hero"><div class="ey">체크·쇼핑</div><div class="big">준비물과 구매목록</div></div><div class="filters"><button class="${tab==='packing'?'on':''}" onclick="check('packing')">준비물</button><button class="${tab==='shop'?'on':''}" onclick="check('shop')">쇼핑</button></div>${tab==='packing'?`<div class="card">${packing.map(x=>ck('p|'+x,x,'packing')).join('')}</div>`:`<div class="card">${shops.map((x,i)=>`<div class="shop"><button class="star" onclick="wish(${i})">${S.shop[i]?.wish?'⭐':'☆'}</button><div><b>${x}</b></div><button class="buy" onclick="bought(${i})">${S.shop[i]?.bought?'완료':'구매'}</button></div>`).join('')}</div>`}`}function ck(k,n,tab){let o=S.checks[k];return `<label class="check ${o?'done':''}"><input type="checkbox" ${o?'checked':''} onchange="S.checks['${esc(k)}']=!S.checks['${esc(k)}'];save();check('${tab}')"><span>${n}</span></label>`}function wish(i){S.shop[i]=S.shop[i]||{};S.shop[i].wish=!S.shop[i].wish;save();check('shop')}function bought(i){S.shop[i]=S.shop[i]||{};S.shop[i].bought=!S.shop[i].bought;save();check('shop')}function tools(){let spent=S.expenses.reduce((a,b)=>a+b,0);let phrases=[['택시 호출','Could you call a taxi for us, please?','Bize taksi çağırabilir misiniz?'],['공항 택시','Could you call a taxi to the airport for us, please?','Havalimanı için bize taksi çağırabilir misiniz?'],['내일 택시 예약','Could you book a taxi to Istanbul Airport for tomorrow at 5 p.m., please?','Yarın saat beşte İstanbul Havalimanı için taksi ayarlayabilir misiniz?'],['공항 셔틀 예약','Could you book an airport shuttle to Kayseri Airport for tomorrow morning, please?','Yarın sabah Kayseri Havalimanı için servis ayarlayabilir misiniz?'],['예약 확인','Is our taxi reservation confirmed?','Taksi rezervasyonumuz kesinleşti mi?']];document.getElementById('tools').innerHTML=`<div class="card hero"><div class="ey">여행도구</div><div class="big">리셉션 회화 + 예산</div></div><div class="card"><div class="title">리셉션에서 바로 들려주기</div>${phrases.map(p=>`<div class="phrase"><span class="badge rec">${p[0]}</span><div class="en">${p[1]}</div><div class="tr">${p[2]}</div><div class="buttons"><button class="btn purple" onclick="say('${esc(p[1])}','en-US')">🔊 영어</button><button class="btn" onclick="say('${esc(p[2])}','tr-TR')">🔊 터키어</button><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(p[1])}')">복사</button></div></div>`).join('')}</div><div class="card"><div class="title">8/19 예약 링크</div><div class="buttons"><a class="btn primary" target="_blank" href="https://experiences.myrealtrip.com/products/4159276">오전 반일투어</a><a class="btn purple" target="_blank" href="https://experiences.myrealtrip.com/products/3436042">오후 미식투어</a><a class="btn" target="_blank" href="${gmap('German Fountain Istanbul')}">게르만분수</a></div></div><div class="card"><div class="title">예산</div><div class="sub">총예산 ₩1,000,000 · 사용액 ₩${spent.toLocaleString()} · 남은예산 ₩${(1000000-spent).toLocaleString()}</div></div>`}function openExpense(){let v=prompt('원화 기준 지출액을 입력하세요. 예: 15000','');if(v&&!isNaN(Number(v))){S.expenses.push(Number(v));save();render()}}function closeModal(){document.getElementById('modal').classList.remove('on')}function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));document.getElementById(v).classList.add('on');document.querySelectorAll('.bottom button').forEach(e=>e.classList.toggle('on',e.dataset.v===v));sessionStorage.setItem('v',v);render();scrollTo(0,0)}function render(){let v=sessionStorage.getItem('v')||'today';if(v==='today')today();if(v==='schedule')schedule();if(v==='transport')transport();if(v==='check')check();if(v==='tools')tools()}document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>go(b.dataset.v));go(sessionStorage.getItem('v')||'today');</script></body></html>
