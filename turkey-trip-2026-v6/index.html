<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6652a3"><title>튀르키예 13일 v6</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f5f8}.actions{position:fixed;z-index:80;right:12px;top:62px;display:flex;gap:7px}.actions button{border:0;border-radius:999px;padding:10px 12px;background:#6652a3;color:#fff;font-weight:900;box-shadow:0 5px 17px #46338255}.actions .money{background:#357953}.shade{position:fixed;inset:0;z-index:100;background:#18131d80;display:none;align-items:flex-end}.shade.on{display:flex}.sheet{width:100%;max-width:760px;max-height:88vh;overflow:auto;margin:auto;background:#f7f6fa;border-radius:22px 22px 0 0;padding:16px 14px 28px}.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:21px}.close{border:0;background:#ece8f3;width:36px;height:36px;border-radius:999px;font-size:20px}.card{background:#fff;border:1px solid #e6e2ea;border-radius:17px;padding:14px;margin:11px 0}.hero{background:linear-gradient(135deg,#fff,#eee9fb)}.title{font-size:17px;font-weight:900;margin:4px 0}.sub{font-size:13px;color:#77717e;line-height:1.55}.ey{font-size:12px;color:#6652a3;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#faf9fc;border:1px solid #e6e2ea;border-radius:13px;padding:10px}.metric small{display:block;color:#77717e;font-size:11px}.metric b{display:block;margin-top:3px;font-size:17px}.green{background:#eef8f1}.orange{background:#fff5e7}.line{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #eee;padding:9px 0;font-size:13px}.line:first-child{border-top:0}.btn{border:0;border-radius:11px;padding:10px;background:#6652a3;color:#fff;font-weight:900}.note{background:#fff7e9;border:1px solid #eddbb9;border-radius:12px;padding:10px;font-size:12px;line-height:1.5;margin-top:10px}@media(max-width:560px){.actions{top:58px}.actions button{padding:9px 10px;font-size:11px}}</style></head><body><iframe id="app" src="../turkey-trip-2026-v4/" title="튀르키예 여행앱"></iframe><div class="actions"><button onclick="jump18()">🛍️ 8/18</button><button class="money" onclick="openBudget()">💰 예산</button></div><div id="shade" class="shade" onclick="if(event.target===this)closeSheet()"><div id="sheet" class="sheet"></div></div><script>const f=document.getElementById('app');const patch=`days['8/13']=()=>'<div class="card hero"><div class="ey">8/13 · 페티예 → 안탈리아</div><div class="big">패러글라이딩 + 버스 + 안탈리아 저녁</div></div>'+meeting('8/13','09:30','FLY LAPUTA 패러글라이딩 미팅','FLY LAPUTA PARAGLIDING Ölüdeniz','09:40 미팅 · 약 2시간 · 호텔에서 도보 약 10분.','긴바지 · 운동화 · 바람막이 · 선글라스','여행사 제공 지도 링크 있음')+card('8/13','12:50','호텔 짐 수령·오토가르 택시 요청',D.bel,'13:00 출발 준비 · Fethiye Otogar까지 약 30분.','transport',true,'편한 이동복',D.bel,phraseButton('Could you call a taxi to Fethiye Bus Station for us, please?','Fethiye Otogarı için bize taksi çağırabilir misiniz?'))+card('8/13','13:40','Fethiye Otogar 승차 준비','Fethiye Otogar','STAR BATMAN · PNR VECG051 · Peron 27 · 좌석 7,10 · 출발 20분 전.','route',true,'편한 이동복')+card('8/13','14:00–17:00','Fethiye → Antalya 버스','Antalya Otogar','17:00 안탈리아 도착.','route',true,'편한 이동복')+card('8/13','17:10 전후','Antalya Otogar → Tuvana','Tuvana Hotel Antalya','짐이 있으므로 택시 우선 추천. 체크인 후 자유시간.','transport',true,'편한 이동복','Antalya Otogar')+card('8/13','18:30–19:20','칼레이치 가벼운 산책','Hadrian’s Gate Antalya','버스 이동 후 무리하지 않게 하드리아누스의 문·칼레이치 골목 중심.','route',false,'가벼운 여름복 · 운동화','Tuvana Hotel Antalya')+card('8/13','19:30 전후','안탈리아 저녁','Kaleiçi Antalya','호텔 가까운 칼레이치에서 간단히 식사. 피곤하면 호텔 주변으로 대체.','meal',false,'편한 여름복');days['8/14']=()=>'<div class="card hero"><div class="ey">8/14 · 안탈리아</div><div class="big">래프팅·집라인 + 오후 자유</div><div class="sub">오전부터 액티비티 일정이 있으므로 자유일정은 투어 종료 후만 넣었습 etItem('tr26spent')||0)+Number(v);localStorage.setItem('tr26spent',s);openBudget()}}function closeSheet(){document.getElementById('shade').classList.remove('on')}</script></body></html>
