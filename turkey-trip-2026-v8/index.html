"row"><input id="amt" class="field" type="number" step="0.01" placeholder="금액"><input id="memo" class="field" placeholder="메모"></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="addMoney()">저장</button></div><div class="card"><div class="row"><input id="eur" class="field" type="number" value="${r.EUR}" placeholder="€1 원"><input id="try" class="field" type="number" value="${r.TRY}" placeholder="₺1 원"></div><button class="btn" style="width:100%;margin-top:8px" onclick="saveRates()">환율 저장</button></div><div class="card">${a.length?a.slice().reverse().map((x,i)=>`<div class="moneyline"><span>${x.c==='KRW'?'₩':x.c==='EUR'?'€':'₺'}${x.a.toLocaleString()} ${x.m||''}</span><button onclick="delMoney(${a.length-1-i})">삭제</button></div>`).join(''):'지출 없음'}</div>`)}function addMoney(){let a=Number(document.getElementById('amt').value),m=document.getElementById('memo').value.trim(),r=rates();if(!a)return;let q=xs(),krw=cur==='KRW'?a:a*r[cur];q.push({a,c:cur,m,krw});localStorage.setItem('tr26v8money',JSON.stringify(q));openMoney()}function delMoney(i){let q=xs();q.splice(i,1);localStorage.setItem('tr26v8money',JSON.stringify(q));openMoney()}function saveRates(){localStorage.setItem('tr26v8rates',JSON.stringify({EUR:Number(document.getElementById('eur').value),TRY:Number(document.getElementById('try').value)}));openMoney()}function show(h){document.getElementById('sheet').innerHTML=h;document.getElementById('modal').classList.add('on')}function closeM(){document.getElementById('modal').classList.remove('on')}function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));document.getElementById(v).classList.add('on');document.querySelectorAll('.bottom button').forEach(e=>e.classList.toggle('on',e.dataset.v===v));sessionStorage.setItem('v8view',v);render()}function render(){let v=sessionStorage.getItem('v8view')||'today';if(v==='today')today();if(v==='schedule')schedule();if(v==='transport')transportView();if(v==='check')check();if(v==='tools')tools()}document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>go(b.dataset.v));go(sessionStorage.getItem('v8view')||'today');</script></body></html>
