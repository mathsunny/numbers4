arget===this)closeM()"><div id="sheet" class="sheet"></div></div><script>const E=s=>encodeURIComponent(s||''),S=(()=>{try{return JSON.parse(localStorage.getItem('tr26final')||'{}')}catch(e){return{}}})();S.done=S.done||{};S.checks=S.checks||{};S.shop=S.shop||{};S.plan=S.plan||'normal';function save(){localStorage.setItem('tr26final',JSON.stringify(S))}function map(d){return'https://www.google.com/maps/dir/?api=1&destination='+E(d)}function search(d){return'https://www.google.com/maps/search/?api=1&query='+E(d)}function hero(d,t,s=''){return`<div class="card hero"><div class="ey">${d}</div><div class="big">${t}</div>${s?`<div class="sub">${s}</div>`:''}</div>`}function card(day,time,title,dest,desc,kind='route',must=false,cloth='',extra=''){let k=day+'|'+time+'|'+title,d=S.done[k];return`<div class="card item ${kind} ${d?'done':''}">${must?'<span class="badge must">❗필수</span>':'<span class="badge rec">⭐추천</span>'}<span class="time">${time}</span><div class="title">${title}</div><div class="sub">${desc}</div>${cloth?`<div class="note"><span class="badge outfit">👕 추천복장</span> ${cloth}</div>`:''}${extra}<div class="buttons"><a class="btn primary" target="_blank" href="${map(dest)}">🗺️ 길찾기</a><a class="btn" target="_blank" href="${search(dest)}">📍 장소보기</a><button class="btn good" onclick="S.done['${k.replaceAll("'","\\'")}']=!S.done['${k.replaceAll("'","\\'")}'];save();render()">${d?'✓ 완료':'✅ 완료'}</button></div></div>`}function exchangeCard(){return`<div class="card item transport"><span class="badge cash">💵 첫 리라 환전</span><span class="time">호텔 체크인 후</span><div class="title">USD $100 → TRY 환전</div><div class="sub">Ölüdeniz · 욀뤼데니즈 중심가의 공식 DÖVİZ 환전소에서 2곳 정도 비교. 달러를 주고 리라를 받으므로 전광판의 <b>USD ALIŞ</b>를 확인.</div><div class="note cashnote"><b>$100 환전 판단 기준</b><br>✅ <b>4,700 TRY 이상</b> — 좋은 편, 환전 OK<br>➖ <b>4,650~4,700 TRY</b> — 무난<br>⚠️ <b>4,600 TRY 이하</b> — 다른 환전소 한 곳 더 비교<br><small>기준 환율은 변동되므로 당일 시장환율과 함께 확인.</small></div><div class="buttons"><a class="btn primary" target="_b lick="openMoney()">₩ / € / ₺ 지출 입력</button></div>`}function openPlan(){show(`<button class="close" onclick="closeM()">×</button><h2>8/19·8/20 일정 전환</h2><div class="switch"><button class="${S.plan==='normal'?'on':''}" onclick="S.plan='normal';save();closeM();render()">A · 19일 투어 정상</button><button class="${S.plan==='morningOff'?'on':''}" onclick="S.plan='morningOff';save();closeM();render()">B · 오전투어만 취소</button><button class="${S.plan==='allOff'?'on':''}" onclick="S.plan='allOff';save();closeM();render()">C · 둘 다 취소</button></div>`)}let cur='TRY';function xs(){try{return JSON.parse(localStorage.getItem('tr26finalmoney')||'[]')}catch(e){return[]}}function rates(){try{return Object.assign({EUR:1627,TRY:29.5},JSON.parse(localStorage.getItem('tr26finalrates')||'{}'))}catch(e){return{EUR:1627,TRY:29.5}}}function openMoney(){let a=xs(),r=rates(),tot=a.reduce((s,x)=>s+x.krw,0);show(`<button class="close" onclick="closeM()">×</button><h2>다중통화 지출</h2><div class="card"><div class="title">총 사용액 ₩${Math.round(tot).toLocaleString()}</div><div class="sub">190만원 기준 잔액 ₩${Math.max(0,1900000-Math.round(tot)).toLocaleString()}</div></div><div class="card"><div class="currs"><button class="${cur==='KRW'?'on':''}" onclick="cur='KRW';openMoney()">₩ 원화</button><button class="${cur==='EUR'?'on':''}" onclick="cur='EUR';openMoney()">€ 유로</button><button class="${cur==='TRY'?'on':''}" onclick="cur='TRY';openMoney()">₺ 리라</button></div><div class="row" style="margin-top:8px"><input id="amt" class="field" type="number" step="0.01" placeholder="금액"><input id="memo" class="field" placeholder="메모"></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="addMoney()">저장</button></div><div class="card"><div class="row"><input id="eur" class="field" type="number" value="${r.EUR}" placeholder="€1 원"><input id="try" class="field" type="number" value="${r.TRY}" placeholder="₺1 원"></div><button class="btn" style="width:100%;margin-top:8px" onclick="saveRates()">환율 저장</button></div><di
