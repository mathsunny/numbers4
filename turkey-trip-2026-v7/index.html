<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6652a3"><title>튀르키예 13일 v7</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f5f8}.bar{position:fixed;z-index:90;top:60px;right:12px;display:flex;gap:7px}.bar button{border:0;border-radius:999px;padding:10px 12px;background:#6652a3;color:#fff;font-weight:900;box-shadow:0 5px 17px #46338255}.bar .green{background:#34764f}.shade{position:fixed;inset:0;z-index:110;background:#18131d80;display:none;align-items:flex-end}.shade.on{display:flex}.sheet{width:100%;max-width:760px;max-height:90vh;overflow:auto;margin:auto;background:#f7f6fa;border-radius:22px 22px 0 0;padding:16px 14px 28px}.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:21px}.close{border:0;background:#ece8f3;width:36px;height:36px;border-radius:999px;font-size:20px}.card{background:#fff;border:1px solid #e6e2ea;border-radius:17px;padding:14px;margin:11px 0}.hero{background:linear-gradient(135deg,#fff,#eee9fb)}.ey{font-size:12px;color:#6652a3;font-weight:900}.title{font-size:17px;font-weight:900;margin:4px 0}.sub{font-size:13px;color:#77717e;line-height:1.55}.btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.btn,a.btn{border:0;text-decoration:none;text-align:center;padding:10px;border-radius:11px;background:#eef1f5;color:#333;font-size:12px;font-weight:850}.primary{background:#2878ee!important;color:#fff!important}.purple{background:#6652a3!important;color:#fff!important}.good{background:#e9f6eb!important;color:#34744a!important}.chosen{outline:2px solid #6652a3}.note{background:#fff7e9;border:1px solid #eddbb9;border-radius:12px;padding:10px;font-size:12px;line-height:1.5;margin-top:10px}.time{color:#2878ee;font-size:12px;font-weight:900}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#eeeeef;color:#666;font-size:11px;font-weight:900}.warn{background:#fff0e8;color:#a8532b}.food{border-left:4px solid #d49a55}.route{border-left:4px solid #79a5e6}</style></head><body><iframe id="base" src="../turkey-trip-2026-v6/" title="튀르키예 여행앱"></iframe><div class="bar"><button onclick="openPlan()">🔄 19·20일 전환</button><button class="green" onclick="openKaymak()">🥛 카이막</button></div><div id="shade" class="shade" onclick="if(event.target===this)closeSheet()"><div id="sheet" class="sheet"></div></div><script>const Q=s=>encodeURIComponent(s);function map(s){return 'https://www.google.com/maps/dir/?api=1&destination='+Q(s)}function search(s){return 'https://www.google.com/maps/search/?api=1&query='+Q(s)}function closeSheet(){document.getElementById('shade').classList.remove('on')}function show(x){document.getElementById('sheet').innerHTML=x;document.getElementById('shade').classList.add('on')}let plan=localStorage.getItem('tr26-ist-plan')||'normal';function choosePlan(p){plan=p;localStorage.setItem('tr26-ist-plan',p);openPlan()}function openPlan(){show(`<div class="head"><h2>8/19·8/20 일정 전환</h2><button class="close" onclick="closeSheet()">×</button></div><div class="card hero"><div class="ey">모집 결과에 따라 선택</div><div class="title">날짜에 묶지 않고 하루 코스로 사용</div><div class="sub">8/20 밤 보스포루스 투어는 고정하고, 낮 일정만 조정합니다.</div></div>${option('normal','A · 19일 투어 정상','19일 오전 반일투어 + 오후 미식투어 / 20일 낮 구시가지·그랜드바자르 + 밤 보스포루스',plan==='normal')}${option('morningOff','B · 오전투어만 취소','19일 오전 자유: Grand Bazaar → Süleymaniye → 카페 / 오후 미식투어는 그대로 / 20일 낮 자유 + 밤 보스포루스',plan==='morningOff')}${option('allOff','C · 19일 투어 둘 다 취소','19일에 원래 20일 자유코스를 통째로 실행 / 20일은 Grand Bazaar·Süleymaniye·Spice Bazaar처럼 호텔 가까운 구시가지 위주 + 밤 보스포루스',plan==='allOff')}<div class="note">카이막 아침은 날짜가 아니라 <b>자유일정 실행하는 날 아침</b>으로 넣었습니다. 19·20일을 통째로 바꿔도 그대로 적용됩니다.</div>`)}function option(id,t,d,on){return `<div class="card ${on?'chosen':''}"><span class="badge ${on?'warn':''}">${on?'✓ 선택됨':'선택지'}</span><div class="title">${t}</div><div class="sub">${d}</div><button class="btn ${on?'good':'purple'}" style="width:100%;margin-top:9px" onclick="choosePlan('${id}')">${on?'현재 선택':'이 일정으로 선택'}</button></div>`}function openKaymak(){let k=localStorage.getItem('tr26-kaymak')||'near';show(`<div class="head"><h2>🥛 카이막 아침</h2><button class="close" onclick="closeSheet()">×</button></div><div class="card hero"><div class="ey">20일 밤 보스포루스 일정 고려</div><div class="title">낮에는 굳이 베식타시까지 갈 필요 없음</div><div class="sub">숙소는 술탄아흐멧·시르케지 쪽이라 가까운 아침을 기본으로 두고, 정말 카이막 맛을 우선하면 베식타시를 선택하도록 했습니다.</div></div>${foodCard('near','가까운 기본안 · Sultanahmet/Sirkeci 아침','BREAKFAST İstanbul MASSA','호텔 근처 술탄아흐멧권에서 아침을 해결하는 동선. <b>bal kaymak 재고/메뉴 여부는 현장에서 확인</b>. 멀리 이동하지 않는 게 장점.',k==='near')}${foodCard('best','맛 우선 · Lumi & Co, Beşiktaş','Lumi & Co Istanbul','베식타시 조식거리의 bal kaymak 추천점. 카이막을 확실히 먹는 목적이면 이쪽이 더 적합하지만 숙소에서는 일부러 이동해야 함.',k==='best')}<div class="note"><b>추천:</b> 이번 일정은 20일 밤에 이미 보스포루스 일정이 있으니 기본값은 <b>가까운 Sultanahmet/Sirkeci 아침</b>으로 두었습니다. 베식타시 카이막은 “꼭 맛집에서 먹고 싶다”는 날만 선택하세요.</div>`)}function foodCard(id,t,place,d,on){return `<div class="card food ${on?'chosen':''}"><span class="badge">${on?'✓ 선택됨':'아침 후보'}</span><div class="title">${t}</div><div class="sub">${d}</div><div class="btns"><a class="btn primary" target="_blank" href="${map(place)}">🗺️ 길찾기</a><a class="btn" target="_blank" href="${search(place)}">📍 장소보기</a></div><button class="btn ${on?'good':'purple'}" style="width:100%;margin-top:8px" onclick="localStorage.setItem('tr26-kaymak','${id}');openKaymak()">${on?'현재 선택':'이곳으로 선택'}</button></div>`}</script></body></html>
