<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6652a3"><title>튀르키예 13일 v7</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f5f8}.bar{position:fixed;z-index:90;top:58px;right:9px;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:96vw}.bar button{border:0;border-radius:999px;padding:8px 9px;background:#6652a3;color:#fff;font-weight:900;box-shadow:0 5px 17px #46338255;font-size:10px}.bar .green{background:#34764f}.bar .money{background:#a7661b}.bar .food{background:#b35f4d}.shade{position:fixed;inset:0;z-index:110;background:#18131d80;display:none;align-items:flex-end}.shade.on{display:flex}.sheet{width:100%;max-width:760px;max-height:90vh;overflow:auto;margin:auto;background:#f7f6fa;border-radius:22px 22px 0 0;padding:16px 13px 28px}.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:21px}.close{border:0;background:#ece8f3;width:36px;height:36px;border-radius:999px;font-size:20px}.card{background:#fff;border:1px solid #e6e2ea;border-radius:17px;padding:14px;margin:11px 0}.hero{background:linear-gradient(135deg,#fff,#eee9fb)}.ey{font-size:12px;color:#6652a3;font-weight:900}.title{font-size:17px;font-weight:900;margin:4px 0}.sub{font-size:13px;color:#77717e;line-height:1.55}.btns,.grid,.rates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.btn,a.btn{border:0;text-decoration:none;text-align:center;padding:10px;border-radius:11px;background:#eef1f5;color:#333;font-size:12px;font-weight:850}.primary,.purple{background:#6652a3!important;color:#fff!important}.good{background:#e9f6eb!important;color:#34744a!important}.chosen{outline:2px solid #6652a3}.note{background:#fff7e9;border:1px solid #eddbb9;border-radius:12px;padding:10px;font-size:12px;line-height:1.5;margin-top:10px}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#eeeeef;color:#666;font-size:11px;font-weight:900}.field{width:100%;border:1px solid #dcd7e3;border-radius:11px;padding:11px;background:#fff;font-size:15px}.currs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}.currs button{border:1px solid #ddd7e8;background:#fff;border-radius:11px;padding:10px 4px;font-weight:900}.currs button.on{background:#6652a3;color:#fff;border-color:#6652a3}.metric{background:#faf9fc;border:1px solid #e6e2ea;border-radius:13px;padding:10px}.metric small{display:block;color:#77717e;font-size:11px}.metric b{display:block;margin-top:3px;font-size:16px}.expense{display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid #eee;padding:9px 0;align-items:center}.expense small{display:block;color:#77717e}.del{border:0;background:#fff0ed;color:#a74d3c;border-radius:9px;padding:7px}.formrow{display:grid;grid-template-columns:1.2fr .8fr;gap:8px}</style></head><body><iframe id="base" src="../turkey-trip-2026-v6/" title="튀르키예 여행앱"></iframe><div class="bar"><button onclick="openPlan()">🔄 19·20일</button><button class="green" onclick="openKaymak()">🥛 카이막</button><button class="food" onclick="jumpAdded()">🕌🍲 일정반영</button><button class="money" onclick="openExpense()">💰 지출</button></div><div id="shade" class="shade" onclick="if(event.target===this)closeSheet()"><div id="sheet" class="sheet"></div></div><script>
const Q=s=>encodeURIComponent(s), base=document.getElementById('base');
function map(s){return'https://www.google.com/maps/dir/?api=1&destination='+Q(s)}function closeSheet(){document.getElementById('shade').classList.remove('on')}function show(h){document.getElementById('sheet').innerHTML=h;document.getElementById('shade').classList.add('on')}
let plan=localStorage.getItem('tr26-ist-plan')||'normal';
function option(id,t,d){let on=plan===id;return`<div class="card ${on?'chosen':''}"><span class="badge">${on?'✓ 선택됨':'선택지'}</span><div class="title">${t}</div><div class="sub">${d}</div><button class="btn ${on?'good':'purple'}" style="width:100%;margin-top:9px" onclick="choosePlan('${id}')">${on?'현재 선택':'이 일정으로 선택'}</button></div>`}
function choosePlan(p){plan=p;localStorage.setItem('tr26-ist-plan',p);openPlan();refreshInner()}
function openPlan(){show(`<div class="head"><h2>8/19·8/20 일정 전환</h2><button class="close" onclick="closeSheet()">×</button></div><div class="card hero"><div class="ey">선택 즉시 실제 일정표에도 반영</div><div class="title">모집 결과에 맞춰 날짜별 카드 변경</div></div>${option('normal','A · 19일 투어 정상','8/19 오전투어 종료 후 쉴레이마니예 자미 → 예니 자미를 넣고 16:00 미식투어로 이동. 8/20은 카이막·돌마바흐체·신시가지 + 밤 보스포루스.')}${option('morningOff','B · 오전투어만 취소','8/19 오전 그랜드 바자르 → 쉴레이마니예 자미 → 스파이스 바자르 → 예니 자미 → 오후 미식투어. 8/20은 카이막·신시가지 + 밤 보스포루스.')}${option('allOff','C · 19일 투어 둘 다 취소','8/19은 카이막·돌마바흐체·신시가지 자유코스, 8/20 낮은 그랜드 바자르 → 쉴레이마니예 자미 → 스파이스 바자르 → 예니 자미 → 호텔 휴식 → 밤 보스포루스.')}`)}
function openKaymak(){show(`<div class="head"><h2>🥛 카이막 아침</h2><button class="close" onclick="closeSheet()">×</button></div><div class="card hero"><div class="ey">맛 + 관광 동선</div><div class="title">Lumi & Co · Beşiktaş(베식타시)</div><div class="sub">bal kaymak(꿀+카이막) 아침 → Dolmabahçe Sarayı(돌마바흐체 궁전) → Taksim Meydanı(탁심 광장) → İstiklal Caddesi(이스티클랄 거리) → Galata/Karaköy(갈라타/카라쾨이).</div><div class="btns"><a class="btn primary" target="_blank" href="${map('Lumi & Co Istanbul')}">카이막 길찾기</a><a class="btn" target="_blank" href="${map('Dolmabahçe Sarayı Istanbul')}">돌마바흐체</a></div></div>`)}
function innerWin(){try{let v6=base.contentDocument;if(!v6)return null;let app=v6.getElementById('app');return app&&app.contentWindow}catch(e){return null}}
function installPatch(){let w=innerWin();if(!w)return;try{w.eval(`(function(){if(window.__v7schedule2)return;window.__v7schedule2=true;const old17=days['8/17'],old19=days['8/19'],old20=days['8/20'];days['8/17']=()=>{let h=old17();if(h.includes('Testi Kebabı'))return h;const extra=card('8/17','12:30–13:50','Seten Restaurant · 세텐 레스토랑 — Testi Kebabı · 테스티 케밥(항아리케밥)','Seten Restaurant Göreme','카파도키아에서 꼭 먹고 싶은 항아리케밥 점심. 이후 Uçhisar Kalesi · 우치히사르 성채와 17:30 ATV 일정 유지.','meal',false,'편한 복장');return h.replace(/(<div class="card[^>]*>[^]*?Seten Restaurant[^]*?<\/div>)/,'$1')+extra};function mosque(time1,time2){return card('IST',time1,'Süleymaniye Camii · 쉴레이마니예 자미','Süleymaniye Camii Istanbul','그랜드 바자르·에미뇌뉘 사이 동선. 기도시간에는 내부 관광 제한 가능.','route',false,'어깨·무릎 가리는 복장')+card('IST',time2,'Mısır Çarşısı · 스파이스 바자르 → Yeni Camii · 예니 자미(신 모스크)','Yeni Cami Istanbul','스파이스 바자르와 예니 자미는 같은 에미뇌뉘 권역. 이후 Karaköy · 카라쾨이 또는 호텔로 이동.','route',false,'단정한 복장')};days['8/19']=()=>{let h=old19(),p=localStorage.getItem('tr26-ist-plan')||'normal';if(p==='normal')return h+mosque('13:10 전후','14:15 전후');if(p==='morningOff')return h+card('IST','09:30 전후','Kapalıçarşı · 그랜드 바자르','Grand Bazaar Istanbul','오전투어 취소 시 자유코스 시작.','route',false,'편한 운동화')+mosque('11:00 전후','12:20 전후');return h};days['8/20']=()=>{let h=old20(),p=localStorage.getItem('tr26-ist-plan')||'normal';if(p==='allOff')return h+card('IST','09:30 전후','Kapalıçarşı · 그랜드 바자르','Grand Bazaar Istanbul','호텔 가까운 구시가지 코스 시작.','route',false,'편한 운동화')+mosque('11:00 전후','12:20 전후')+card('IST','14:00 이후','호텔 복귀·휴식','Shining Star Hotel Istanbul','저녁 보스포루스 야간투어 전 충분히 휴식.','hotel',false,'편한 복장');return h};render()})()`)}catch(e){console.error(e)}}
function refreshInner(){let w=innerWin();try{if(w){w.eval('render()')}}catch(e){}setTimeout(installPatch,250)}
function jumpAdded(){let w=innerWin();if(!w)return alert('일정표 로딩 중입니다. 잠시 후 다시 눌러주세요.');let p=localStorage.getItem('tr26-ist-plan')||'normal',d=p==='allOff'?'8/20':p==='morningOff'?'8/19':'8/19';try{w.eval(`sessionStorage.setItem('day','${d}');sessionStorage.setItem('v','schedule');go('schedule');schedule('${d}')`)}catch(e){alert('일정표에서 '+d+' 날짜를 확인해 주세요.')}}
let expenseCurrency='TRY';function expenseData(){try{return JSON.parse(localStorage.getItem('tr26expenses')||'[]')}catch(e){return[]}}function rates(){try{return Object.assign({EUR:1627,TRY:29.5},JSON.parse(localStorage.getItem('tr26rates')||'{}'))}catch(e){return{EUR:1627,TRY:29.5}}}function toKRW(a,c){let r=rates();return c==='KRW'?a:a*(r[c]||0)}function sym(c){return c==='KRW'?'₩':c==='EUR'?'€':'₺'}function fmt(a,c){return sym(c)+(c==='KRW'?Math.round(a).toLocaleString():Number(a).toLocaleString(undefined,{maximumFractionDigits:2}))}
function openExpense(){let xs=expenseData(),legacy=Number(localStorage.getItem('tr26spent')||0),total=legacy+xs.reduce((s,x)=>s+Number(x.krw||0),0),r=rates(),by={KRW:0,EUR:0,TRY:0};xs.forEach(x=>by[x.currency]+=Number(x.amount||0));show(`<div class="head"><h2>💰 다중통화 지출</h2><button class="close" onclick="closeSheet()">×</button></div><div class="card"><div class="grid"><div class="metric"><small>총 사용액</small><b>₩${Math.round(total).toLocaleString()}</b></div><div class="metric"><small>권장예산 잔액</small><b>₩${Math.max(0,1900000-Math.round(total)).toLocaleString()}</b></div><div class="metric"><small>유로</small><b>€${by.EUR.toLocaleString()}</b></div><div class="metric"><small>리라</small><b>₺${by.TRY.toLocaleString()}</b></div></div></div><div class="card"><div class="currs"><button class="${expenseCurrency==='KRW'?'on':''}" onclick="expenseCurrency='KRW';openExpense()">₩ 원화</button><button class="${expenseCurrency==='EUR'?'on':''}" onclick="expenseCurrency='EUR';openExpense()">€ 유로</button><button class="${expenseCurrency==='TRY'?'on':''}" onclick="expenseCurrency='TRY';openExpense()">₺ 리라</button></div><div class="formrow"><input id="exAmount" class="field" type="number" step="0.01" placeholder="금액"><input id="exNote" class="field" placeholder="메모"></div><button class="btn purple" style="width:100%;margin-top:9px" onclick="saveExpense()">＋ 지출 저장</button></div><div class="card"><div class="rates"><input id="rateEUR" class="field" type="number" value="${r.EUR}" placeholder="€1 원화"><input id="rateTRY" class="field" type="number" value="${r.TRY}" placeholder="₺1 원화"></div><button class="btn" style="width:100%;margin-top:9px" onclick="saveRates()">환율 저장</button></div><div class="card">${xs.length?xs.slice().reverse().map((x,ri)=>`<div class="expense"><div><b>${fmt(x.amount,x.currency)} ${x.note?'· '+x.note:''}</b><small>원화 환산 ₩${Math.round(x.krw).toLocaleString()}</small></div><button class="del" onclick="delExpense(${xs.length-1-ri})">삭제</button></div>`).join(''):'<div class="sub">아직 입력된 지출이 없습니다.</div>'}</div>`)}
function saveExpense(){let a=Number(document.getElementById('exAmount').value),n=(document.getElementById('exNote').value||'').trim();if(!a)return alert('금액을 입력해 주세요.');let xs=expenseData();xs.push({amount:a,currency:expenseCurrency,krw:toKRW(a,expenseCurrency),note:n,date:new Date().toLocaleDateString('ko-KR')});localStorage.setItem('tr26expenses',JSON.stringify(xs));openExpense()}function delExpense(i){let xs=expenseData();xs.splice(i,1);localStorage.setItem('tr26expenses',JSON.stringify(xs));openExpense()}function saveRates(){let e=Number(document.getElementById('rateEUR').value),t=Number(document.getElementById('rateTRY').value);if(!e||!t)return alert('환율을 입력해 주세요.');localStorage.setItem('tr26rates',JSON.stringify({EUR:e,TRY:t}));openExpense()}
function bilingualize(){try{let w=innerWin();if(!w)return;w.eval(`(function(){const pairs=[['Grand Bazaar','Kapalıçarşı · 그랜드 바자르'],['Süleymaniye Mosque','Süleymaniye Camii · 쉴레이마니예 자미'],['Spice Bazaar','Mısır Çarşısı · 스파이스 바자르'],['Dolmabahçe Palace','Dolmabahçe Sarayı · 돌마바흐체 궁전'],['Galata Tower','Galata Kulesi · 갈라타 타워'],['Basilica Cistern','Yerebatan Sarnıcı · 예레바탄 지하궁전'],['Uçhisar Castle','Uçhisar Kalesi · 우치히사르 성채']];const tw=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=tw.nextNode()){let t=n.nodeValue;for(const[a,b]of pairs)if(t&&t.includes(a)&&!t.includes(b))t=t.split(a).join(b);n.nodeValue=t}})()`)}catch(e){}}
base.addEventListener('load',()=>{setTimeout(installPatch,900);setTimeout(installPatch,2200);setTimeout(bilingualize,2500)});setInterval(()=>{installPatch();bilingualize()},3500);
</script></body></html>
