<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6652a3"><title>튀르키예 13일 v7</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f5f8}.bar{position:fixed;z-index:90;top:60px;right:10px;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:96vw}.bar button{border:0;border-radius:999px;padding:9px 10px;background:#6652a3;color:#fff;font-weight:900;box-shadow:0 5px 17px #46338255;font-size:11px}.bar .green{background:#34764f}.bar .money{background:#a7661b}.bar .foodbtn{background:#b35f4d}.shade{position:fixed;inset:0;z-index:110;background:#18131d80;display:none;align-items:flex-end}.shade.on{display:flex}.sheet{width:100%;max-width:760px;max-height:90vh;overflow:auto;margin:auto;background:#f7f6fa;border-radius:22px 22px 0 0;padding:16px 14px 28px}.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:21px}.close{border:0;background:#ece8f3;width:36px;height:36px;border-radius:999px;font-size:20px}.card{background:#fff;border:1px solid #e6e2ea;border-radius:17px;padding:14px;margin:11px 0}.hero{background:linear-gradient(135deg,#fff,#eee9fb)}.ey{font-size:12px;color:#6652a3;font-weight:900}.title{font-size:17px;font-weight:900;margin:4px 0}.sub{font-size:13px;color:#77717e;line-height:1.55}.btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.btn,a.btn{border:0;text-decoration:none;text-align:center;padding:10px;border-radius:11px;background:#eef1f5;color:#333;font-size:12px;font-weight:850}.primary{background:#2878ee!important;color:#fff!important}.purple{background:#6652a3!important;color:#fff!important}.good{background:#e9f6eb!important;color:#34744a!important}.chosen{outline:2px solid #6652a3}.note{background:#fff7e9;border:1px solid #eddbb9;border-radius:12px;padding:10px;font-size:12px;line-height:1.5;margin-top:10px}.time{color:#2878ee;font-size:12px;font-weight:900}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#eeeeef;color:#666;font-size:11px;font-weight:900}.warn{background:#fff0e8;color:#a8532b}.food{border-left:4px solid #d49a55}.route{border-left:4px solid #79a5e6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#faf9fc;border:1px solid #e6e2ea;border-radius:13px;padding:10px}.metric small{display:block;color:#77717e;font-size:11px}.metric b{display:block;margin-top:3px;font-size:16px}.formrow{display:grid;grid-template-columns:1.25fr .75fr;gap:8px;margin-top:8px}.field{width:100%;border:1px solid #dcd7e3;border-radius:11px;padding:11px;background:#fff;font-size:15px}.currs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}.currs button{border:1px solid #ddd7e8;background:#fff;border-radius:11px;padding:10px 4px;font-weight:900}.currs button.on{background:#6652a3;color:#fff;border-color:#6652a3}.expense{display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid #eee;padding:9px 0;align-items:center}.expense:first-child{border-top:0}.expense b{font-size:14px}.expense small{display:block;color:#77717e;margin-top:2px}.del{border:0;background:#fff0ed;color:#a74d3c;border-radius:9px;padding:7px 9px;font-weight:900}.rates{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ratebox label{display:block;font-size:11px;color:#77717e;margin-bottom:4px}@media(max-width:520px){.bar{top:58px}.bar button{padding:8px 8px;font-size:10px}.sheet{padding-left:12px;padding-right:12px}}</style></head><body><iframe id="base" src="../turkey-trip-2026-v6/" title="튀르키예 여행앱"></iframe><div class="bar"><button onclick="openPlan()">🔄 19·20일</button><button class="green" onclick="openKaymak()">🥛 카이막</button><button class="foodbtn" onclick="openAdditions()">🕌🍲 추가일정</button><button class="money" onclick="openExpense()">💰 지출</button></div><div id="shade" class="shade" onclick="if(event.target===this)closeSheet()"><div id="sheet" class="sheet"></div></div><script>const Q=s=>encodeURIComponent(s);function map(s){return 'https://www.google.com/maps/dir/?api=1&destination='+Q(s)}function search(s){return 'https://www.google.com/maps/search/?api=1&query='+Q(s)}function closeSheet(){document.getElementById('shade').classList.remove('on')}function show(x){document.getElementById('sheet').innerHTML=x;document.getElementById('shade').classList.add('on')}let plan=localStorage.getItem('tr26-ist-plan')||'normal';function choosePlan(p){plan=p;localStorage.setItem('tr26-ist-plan',p);openPlan();patchFrames()}function openPlan(){show(`<div class="head"><h2>8/19·8/20 일정 전환</h2><button class="close" onclick="closeSheet()">×</button></div><div class="card hero"><div class="ey">모집 결과에 따라 선택</div><div class="title">날짜에 묶지 않고 하루 코스로 사용</div><div class="sub">8/20 밤 보스포루스 투어는 고정하고, 낮 일정만 조정합니다.</div></div>${option('normal','A · 19일 투어 정상','19일 오전 반일투어 + 오후 미식투어 / 20일 낮 Beşiktaş(베식타시) 카이막 → Dolmabahçe Sarayı(돌마바흐체 궁전) → 신시가지 → 호텔 휴식 → 밤 보스포루스. Yeni Camii(예니 자미)와 Süleymaniye Camii(쉴레이마니예 자미)는 구시가지 자유시간에 넣습니다.',plan==='normal')}${option('morningOff','B · 오전투어만 취소','19일 오전: Kapalıçarşı(그랜드 바자르) → Süleymaniye Camii(쉴레이마니예 자미) → Mısır Çarşısı(스파이스 바자르) → Yeni Camii(예니 자미) / 오후 미식투어 그대로 / 20일 카이막·신시가지 + 밤 보스포루스',plan==='morningOff')}${option('allOff','C · 19일 투어 둘 다 취소','19일 자유코스 실행 / 20일은 호텔 가까운 구시가지에서 Kapalıçarşı(그랜드 바자르) → Süleymaniye Camii(쉴레이마니예 자미) → Mısır Çarşısı(스파이스 바자르) → Yeni Camii(예니 자미) 후 휴식 → 밤 보스포루스',plan==='allOff')}<div class="note">모스크는 실제 예배 장소이므로 현장 기도시간에는 내부 관광이 제한될 수 있습니다.</div>`)}function option(id,t,d,on){return `<div class="card ${on?'chosen':''}"><span class="badge ${on?'warn':''}">${on?'✓ 선택됨':'선택지'}</span><div class="title">${t}</div><div class="sub">${d}</div><button class="btn ${on?'good':'purple'}" style="width:100%;margin-top:9px" onclick="choosePlan('${id}')">${on?'현재 선택':'이 일정으로 선택'}</button></div>`}function openKaymak(){let k=localStorage.getItem('tr26-kaymak')||'best';show(`<div class="head"><h2>🥛 카이막 아침</h2><button class="close" onclick="closeSheet()">×</button></div><div class="card hero"><div class="ey">관광 동선과 묶어서 이동</div><div class="title">Beşiktaş · 베식타시에서 카이막 → 관광</div><div class="sub">카이막만 먹고 호텔로 돌아오는 일정이 아니라, 아침식사 후 Dolmabahçe Sarayı(돌마바흐체 궁전) → Taksim Meydanı(탁심 광장) → İstiklal Caddesi(이스티클랄 거리) → Galata/Karaköy(갈라타/카라쾨이) 방향으로 이어갑니다.</div></div>${foodCard('best','추천 · Lumi & Co · Beşiktaş(베식타시)','Lumi & Co Istanbul','베식타시 조식거리에서 bal kaymak(꿀+카이막)를 먹고 바로 관광을 시작하는 동선.',k==='best')}${foodCard('near','가까운 대체안 · Sultanahmet/Sirkeci(술탄아흐멧/시르케지)','BREAKFAST İstanbul MASSA','컨디션이 안 좋거나 멀리 이동하기 싫은 날의 대체안. bal kaymak 메뉴/재고는 현장에서 확인.',k==='near')}<div class="card route"><span class="badge">추천 동선</span><div class="title">20일 낮 관광 코스</div><div class="sub"><b>Beşiktaş(베식타시)</b> 카이막 아침 → <b>Dolmabahçe Sarayı(돌마바흐체 궁전)</b> → <b>Taksim Meydanı(탁심 광장)</b> → <b>İstiklal Caddesi(이스티클랄 거리)</b> → <b>Galata Kulesi(갈라타 타워) 주변</b> → <b>Karaköy(카라쾨이)</b> → 호텔 휴식 → 🌙 보스포루스 야간투어</div></div>`)}function foodCard(id,t,place,d,on){return `<div class="card food ${on?'chosen':''}"><span class="badge">${on?'✓ 선택됨':'후보'}</span><div class="title">${t}</div><div class="sub">${d}</div><div class="btns"><a class="btn primary" target="_blank" href="${map(place)}">🗺️ 길찾기</a><a class="btn" target="_blank" href="${search(place)}">📍 장소보기</a></div><button class="btn ${on?'good':'purple'}" style="width:100%;margin-top:8px" onclick="localStorage.setItem('tr26-kaymak','${id}');openKaymak()">${on?'현재 선택':'이곳으로 선택'}</button></div>`}function openAdditions(){let p=localStorage.getItem('tr26-ist-plan')||'normal';let ist=p==='morningOff'?'8/19 오전':p==='allOff'?'8/20 낮':'구시가지 자유시간';show(`<div class="head"><h2>🕌🍲 추가 반영 일정</h2><button class="close" onclick="closeSheet()">×</button></div><div class="card hero"><div class="ey">이스탄불</div><div class="title">${ist} · 모스크 2곳</div><div class="sub">동선: <b>Kapalıçarşı(그랜드 바자르) → Süleymaniye Camii(쉴레이마니예 자미) → Mısır Çarşısı(스파이스 바자르) → Yeni Camii(예니 자미·신 모스크) → Eminönü(에미뇌뉘)</b></div><div class="btns"><a class="btn primary" target="_blank" href="${map('Süleymaniye Camii Istanbul')}">쉴레이마니예 길찾기</a><a class="btn primary" target="_blank" href="${map('Yeni Cami Istanbul')}">예니 자미 길찾기</a></div><div class="note">기도시간에는 관광객 내부 입장이 제한될 수 있으므로 현장 안내 우선.</div></div><div class="card food"><div class="ey">8/17 · 카파도키아</div><div class="title">Seten Restaurant · 세텐 레스토랑</div><div class="sub"><b>Testi Kebabı · 테스티 케밥(항아리케밥)</b> 점심으로 표시했습니다. 기존 12:30~13:50 Seten 점심 시간에 먹으면 이후 Uçhisar Kalesi(우치히사르 성채)와 17:30 ATV 일정에 무리가 없습니다.</div><div class="btns"><a class="btn primary" target="_blank" href="${map('Seten Restaurant Göreme')}">🗺️ 세텐 길찾기</a><a class="btn" target="_blank" href="${search('Seten Restaurant Göreme')}">📍 장소보기</a></div></div>`)}let expenseCurrency='TRY';function expenseData(){try{return JSON.parse(localStorage.getItem('tr26expenses')||'[]')}catch(e){return[]}}function rates(){try{return Object.assign({EUR:1627,TRY:29.5},JSON.parse(localStorage.getItem('tr26rates')||'{}'))}catch(e){return{EUR:1627,TRY:29.5}}}function toKRW(a,c){let r=rates();return c==='KRW'?a:a*(r[c]||0)}function sym(c){return c==='KRW'?'₩':c==='EUR'?'€':'₺'}function fmt(a,c){return sym(c)+(c==='KRW'?Math.round(a).toLocaleString():Number(a).toLocaleString(undefined,{maximumFractionDigits:2}))}function openExpense(){let xs=expenseData(),legacy=Number(localStorage.getItem('tr26spent')||0),total=legacy+xs.reduce((s,x)=>s+Number(x.krw||0),0),plan=1900000,r=rates(),by={KRW:0,EUR:0,TRY:0};xs.forEach(x=>by[x.currency]=(by[x.currency]||0)+Number(x.amount||0));show(`<div class="head"><h2>💰 다중통화 지출</h2><button class="close" onclick="closeSheet()">×</button></div><div class="card hero"><div class="ey">원화 · 유로 · 튀르키예 리라</div><div class="title">현지 통화 그대로 입력</div><div class="sub">입력한 금액은 원화로 자동 환산해 전체 예산에서 차감합니다.</div></div><div class="card"><div class="grid"><div class="metric"><small>총 사용액 · 원화환산</small><b>₩${Math.round(total).toLocaleString()}</b></div><div class="metric"><small>권장예산 잔액</small><b>₩${Math.max(0,Math.round(plan-total)).toLocaleString()}</b></div><div class="metric"><small>€ 유로 사용</small><b>€${by.EUR.toLocaleString(undefined,{maximumFractionDigits:2})}</b></div><div class="metric"><small>₺ 리라 사용</small><b>₺${by.TRY.toLocaleString(undefined,{maximumFractionDigits:2})}</b></div></div>${legacy?`<div class="note">기존 앱에서 입력했던 원화 지출 ₩${legacy.toLocaleString()}도 합계에 포함되어 있습니다.</div>`:''}</div><div class="card"><div class="title">지출 추가</div><div class="currs"><button class="${expenseCurrency==='KRW'?'on':''}" onclick="expenseCurrency='KRW';openExpense()">₩ 원화</button><button class="${expenseCurrency==='EUR'?'on':''}" onclick="expenseCurrency='EUR';openExpense()">€ 유로</button><button class="${expenseCurrency==='TRY'?'on':''}" onclick="expenseCurrency='TRY';openExpense()">₺ 리라</button></div><div class="formrow"><input id="exAmount" class="field" type="number" step="0.01" inputmode="decimal" placeholder="금액 입력"><input id="exNote" class="field" type="text" placeholder="메모"></div><button class="btn purple" style="width:100%;margin-top:9px" onclick="saveExpense()">＋ 지출 저장</button></div><div class="card"><div class="title">환율 설정</div><div class="rates"><div class="ratebox"><label>€ 1 = 원</label><input id="rateEUR" class="field" type="number" step="0.1" value="${r.EUR}"></div><div class="ratebox"><label>₺ 1 = 원</label><input id="rateTRY" class="field" type="number" step="0.01" value="${r.TRY}"></div></div><button class="btn" style="width:100%;margin-top:9px" onclick="saveRates()">환율 저장</button></div><div class="card"><div class="title">최근 지출</div>${xs.length?xs.slice().reverse().map((x,ri)=>{let i=xs.length-1-ri;return `<div class="expense"><div><b>${fmt(x.amount,x.currency)} ${x.note?'· '+x.note:''}</b><small>원화 환산 ₩${Math.round(x.krw).toLocaleString()} · ${x.date||''}</small></div><button class="del" onclick="delExpense(${i})">삭제</button></div>`}).join(''):'<div class="sub">아직 입력된 지출이 없습니다.</div>'}</div>`)}function saveExpense(){let a=Number(document.getElementById('exAmount').value),n=(document.getElementById('exNote').value||'').trim();if(!a||a<0)return alert('금액을 입력해 주세요.');let xs=expenseData();xs.push({amount:a,currency:expenseCurrency,krw:toKRW(a,expenseCurrency),note:n,date:new Date().toLocaleDateString('ko-KR')});localStorage.setItem('tr26expenses',JSON.stringify(xs));openExpense()}function delExpense(i){let xs=expenseData();xs.splice(i,1);localStorage.setItem('tr26expenses',JSON.stringify(xs));openExpense()}function saveRates(){let e=Number(document.getElementById('rateEUR').value),t=Number(document.getElementById('rateTRY').value);if(!e||!t)return alert('환율을 입력해 주세요.');localStorage.setItem('tr26rates',JSON.stringify({EUR:e,TRY:t}));openExpense()}const labels=[['Grand Bazaar','Kapalıçarşı · 그랜드 바자르'],['Süleymaniye Mosque','Süleymaniye Camii · 쉴레이마니예 모스크'],['Spice Bazaar','Mısır Çarşısı · 스파이스 바자르'],['Dolmabahçe Palace','Dolmabahçe Sarayı · 돌마바흐체 궁전'],['Dolmabahce Palace','Dolmabahçe Sarayı · 돌마바흐체 궁전'],['Taksim Square','Taksim Meydanı · 탁심 광장'],['Istiklal','İstiklal Caddesi · 이스티클랄 거리'],['İstiklal','İstiklal Caddesi · 이스티클랄 거리'],['Galata Tower','Galata Kulesi · 갈라타 타워'],['Karaköy','Karaköy · 카라쾨이'],['Besiktas','Beşiktaş · 베식타시'],['Beşiktaş','Beşiktaş · 베식타시'],['Sultanahmet','Sultanahmet · 술탄아흐멧'],['Sirkeci','Sirkeci · 시르케지'],['Basilica Cistern','Yerebatan Sarnıcı · 예레바탄 지하궁전'],['Göreme Open Air Museum','Göreme Açık Hava Müzesi · 괴레메 야외박물관'],['Uçhisar Castle','Uçhisar Kalesi · 우치히사르 성채'],['Hadrian’s Gate','Hadrian Kapısı · 하드리아누스의 문'],['Hadrian\'s Gate','Hadrian Kapısı · 하드리아누스의 문'],['Kaleiçi','Kaleiçi · 칼레이치(안탈리아 구시가지)'],['Antalya Old City Marina','Antalya Kaleiçi Marina · 안탈리아 구시가지 마리나'],['Konyaaltı Beach','Konyaaltı Plajı · 콘야알트 해변'],['Ölüdeniz Beach','Ölüdeniz Plajı · 욀뤼데니즈 해변'],['Fethiye Otogar','Fethiye Otogarı · 페티예 버스터미널'],['Yeni Cami','Yeni Camii · 예니 자미(신 모스크)'],['Testi Kebab','Testi Kebabı · 테스티 케밥(항아리케밥)']];function bilingualize(doc){if(!doc||!doc.body)return;const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){let t=n.nodeValue;if(!t||!t.trim())continue;for(const [a,b] of labels){if(t.includes(a)&&!t.includes(b))t=t.split(a).join(b)}n.nodeValue=t}for(const fr of doc.querySelectorAll('iframe')){try{if(fr.contentDocument)bilingualize(fr.contentDocument)}catch(e){}}}function deepestWindow(){try{let a=document.getElementById('base').contentWindow;let b=a.document.querySelector('iframe');if(b&&b.contentWindow){let c=b.contentWindow;if(c.days&&c.card)return c}if(a.days&&a.card)return a}catch(e){}return null}function patchItinerary(){let w=deepestWindow();if(!w||!w.days||w.__v7foodpatch)return;try{let d17=w.days['8/17'];if(d17)w.days['8/17']=()=>d17().replace('Seten Restaurant 점심','Seten Restaurant · 세텐 레스토랑 점심 · Testi Kebabı · 테스티 케밥(항아리케밥)').replace('카파도키아 현지식','카파도키아 대표 음식 Testi Kebabı · 테스티 케밥(항아리케밥) 추천');let d19=w.days['8/19'],d20=w.days['8/20'];const mosqueCards=()=>w.card('IST','자유시간','Süleymaniye Camii · 쉴레이마니예 자미','Süleymaniye Camii Istanbul','그랜드 바자르에서 에미뇌뉘 방향으로 이동하며 방문. 기도시간에는 내부 관광 제한 가능.','route',false,'어깨·무릎 가리는 복장')+w.card('IST','이어서','Mısır Çarşısı · 스파이스 바자르 → Yeni Camii · 예니 자미(신 모스크)','Yeni Cami Istanbul','스파이스 바자르와 예니 자미를 같은 권역으로 묶어 방문. 이후 Eminönü · 에미뇌뉘 산책.','route',false,'모스크 방문 가능한 단정한 복장');if(d19)w.days['8/19']=()=>{let h=d19();let p=localStorage.getItem('tr26-ist-plan')||'normal';return p==='morningOff'?h+mosqueCards():h};if(d20)w.days['8/20']=()=>{let h=d20();let p=localStorage.getItem('tr26-ist-plan')||'normal';return (p==='allOff'||p==='normal')?h+mosqueCards():h};w.__v7foodpatch=true;if(w.render)w.render()}catch(e){console.error(e)}}function patchFrames(){try{bilingualize(document);const f=document.getElementById('base');if(f&&f.contentDocument){bilingualize(f.contentDocument);const old=f.contentDocument.querySelector('.actions .money');if(old)old.style.display='none';const inner=f.contentDocument.querySelector('iframe');if(inner&&inner.contentDocument)bilingualize(inner.contentDocument)}patchItinerary()}catch(e){}}document.getElementById('base').addEventListener('load',()=>{setTimeout(patchFrames,800);setTimeout(patchFrames,2200)});setInterval(patchFrames,4000);</script></body></html>
