t.getElementById('tools').innerHTML=`<div class="card hero"><div class="ey">여행도구</div><div class="big">회화 · 환율 · 가계부</div></div><div class="card"><div class="title">예산</div><div class="metricgrid"><div class="metric"><small>총예산</small><b>₩1,000,000</b></div><div class="metric"><small>사용액</small><b>₩${Math.round(spent).toLocaleString()}</b></div><div class="metric"><small>남은예산</small><b>₩${Math.round(1000000-spent).toLocaleString()}</b></div><div class="metric"><small>별도 현금</small><b>$500</b></div></div><button class="btn purple" style="width:100%;margin-top:10px" onclick="openExpense()">＋ 지출 입력</button></div><div class="card"><div class="title">여행 기준환율</div><div class="two"><div class="field"><label>TRY→KRW</label><input id="rTRY" value="${S.rate.TRY}" oninput="rate()"></div><div class="field"><label>EUR→KRW</label><input id="rEUR" value="${S.rate.EUR}" oninput="rate()"></div></div><div class="field"><label>USD→KRW</label><input id="rUSD" value="${S.rate.USD}" oninput="rate()"></div><a class="btn" style="display:block;margin-top:9px" target="_blank" href="https://www.google.com/search?q=TRY+KRW+exchange+rate">실시간 환율 확인</a></div><div class="card"><div class="title">호텔 회화</div>${phrases.map(p=>`<div class="phrase"><span class="badge rec">${p[0]}</span><b>${p[1]}</b><div class="tr">${p[2]}</div><div class="sub">${p[3]}</div><div class="row"><button class="btn" onclick="speak('${esc(p[1])}','en-US')">🔊 영어</button><button class="btn" onclick="speak('${esc(p[2])}','tr-TR')">🔊 터키어</button></div></div>`).join('')}</div><div class="card"><div class="title">중요 연락처</div><div class="sub">현지 비상연락 +90 53 7818 6816 · 카카오 harun55<br>젊은여행사블루 02-3445-6161</div></div>`}function rate(){['TRY','EUR','USD'].forEach(c=>S.rate[c]=Number(document.getElementById('r'+c)?.value)||S.rate[c]);save()}function openExpense(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="ey">빠른 지출</div><div class="section" style="margin-top:4px">얼마 썼나요?</div><div class="two"><div class="field"><label>금액</label><input id="ea" inputmode="decimal"></div><div class="field"><label>통화</label><select id="ec"><option>TRY</option><option>EUR</option><option>USD</option><option>KRW</option></select></div></div><div class="two"><div class="field"><label>분류</label><select id="ek"><option>교통</option><option>식비</option><option>관광</option><option>쇼핑</option><option>기타</option></select></div><div class="field"><label>결제</label><select id="ep"><option>현금</option><option>카드</option><option>교통카드</option></select></div></div><div class="field"><label>메모</label><input id="em"></div><button class="btn purple" style="width:100%;margin-top:12px" onclick="expense()">저장</button>`;document.getElementById('modal').classList.add('on')}function expense(){let a=Number(document.getElementById('ea').value),c=document.getElementById('ec').value;if(!a)return;let r=c==='KRW'?1:S.rate[c];S.expenses.push({krw:a*r});save();closeModal();render()}function closeModal(){document.getElementById('modal').classList.remove('on')}function speak(t,l){let u=new SpeechSynthesisUtterance(t);u.lang=l;speechSynthesis.cancel();speechSynthesis.speak(u)}function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));document.getElementById(v).classList.add('on');document.querySelectorAll('.bottom button').forEach(e=>e.classList.toggle('on',e.dataset.v===v));sessionStorage.setItem('v',v);render();scrollTo(0,0)}function render(){let v=sessionStorage.getItem('v')||'today';if(v==='today')today();if(v==='schedule')schedule();if(v==='transport')trans();if(v==='check')chk();if(v==='tools')tools()}document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>go(b.dataset.v));go(sessionStorage.getItem('v')||'today');</script></body></html>
