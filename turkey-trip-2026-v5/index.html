<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6652a3"><title>튀르키예 13일 v5</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f5f5f8;color:#26222d}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}.open{position:fixed;z-index:20;right:14px;top:62px;border:0;border-radius:999px;padding:11px 14px;background:#6652a3;color:#fff;font-weight:900;box-shadow:0 6px 20px #3e2c7c55}.shade{position:fixed;inset:0;z-index:30;background:#1b162280;display:none;align-items:flex-end}.shade.on{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#f7f6fa;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:16px 14px 28px}.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:21px}.close{border:0;background:#ece8f3;width:36px;height:36px;border-radius:999px;font-size:20px}.cities,.routes{display:flex;gap:7px;overflow:auto;padding:12px 0;scrollbar-width:none}.cities button,.routes button{white-space:nowrap;border:1px solid #dcd6e8;background:white;padding:9px 11px;border-radius:999px;font-weight:850}.cities .on,.routes .on{background:#6652a3;color:white;border-color:#6652a3}.card{background:white;border:1px solid #e7e2eb;border-radius:17px;padding:14px;margin-bottom:11px;box-shadow:0 5px 18px #493a760d}.hero{background:linear-gradient(135deg,#fff,#efeafb)}.ey{font-size:12px;color:#6652a3;font-weight:900}.title{font-size:17px;font-weight:900;margin:4px 0}.sub{font-size:13px;color:#77717e;line-height:1.55}.time{color:#2878ee;font-size:12px;font-weight:900}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#eeeeef;color:#666;font-size:11px;font-weight:900}.meal{border-left:4px solid #dc9a62}.spot{border-left:4px solid #7aa8e8}.rest{border-left:4px solid #77b49d}.btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.btn{border:0;text-decoration:none;text-align:center;padding:10px;border-radius:11px;background:#eef1f5;color:#333;font-size:12px;font-weight:850}.primary{background:#2878ee;color:white}.save{width:100%;margin-top:8px;border:0;border-radius:12px;padding:11px;background:#e9f6eb;color:#34744a;font-weight:900}.saved{background:#6652a3;color:white}.notice{background:#fff7e8;border:1px solid #efd9ad;border-radius:13px;padding:10px;font-size:12px;line-height:1.5;margin-bottom:12px}</style></head><body><iframe src="../turkey-trip-2026-v4/" title="튀르키예 여행앱 v4"></iframe><button class="open" onclick="openRec()">⭐ 추천코스 3개</button><div id="shade" class="shade" onclick="if(event.target===this)closeRec()"><div class="sheet"><div class="head"><h2>도시별 추천코스</h2><button class="close" onclick="closeRec()">×</button></div><div class="notice">확정 일정과 별개인 ⭐추천 선택지입니다. 카파도키아는 8/16 그린투어와 겹치지 않는 방향으로 구성했습니다. 코스를 고른 뒤 각 장소의 Google Maps 버튼을 바로 사용할 수 있어요.</div><div class="cities"><button id="c-capp" onclick="city('capp')">카파도키아</button><button id="c-ant" onclick="city('ant')">안탈리아</button><button id="c-ist" onclick="city('ist')">이스탄불</button></div><div id="routes" class="routes"></div><div id="content"></div></div></div><script>const R={capp:{name:'카파도키아 · 8/17 자유일',note:'8/16 그린투어의 데린쿠유·으흘라라·나르호수·피죤밸리를 피해서 선택했습니다.',routes:[{id:'A',name:'A 문화·전망',tag:'가장 무난',items:[['09:00–11:15','Göreme Open Air Museum','괴레메 야외박물관','spot','프레스코·암굴교회 중심. 오전에 먼저 보면 덜 덥습니다.'],['11:30–12:20','Göreme town center','괴레메 카페 휴식','rest','ATV 전 체력 비축.'],['12:30–13:50','Seten Restaurant Göreme','Seten Restaurant 점심','meal','테스티 케밥 등 현지식 후보.'],['14:10–15:40','Uçhisar Castle','우치히사르 성채','spot','전망 중심. 택시 이동 추천.']]},{id:'B',name:'B 요정굴뚝·도자기',tag:'사진+체험',items:[['09:00–10:30','Paşabağları Müze ve Örenyeri','Paşabağ 요정굴뚝','spot','독특한 다중 머리 요정굴뚝 사진.'],['10:45–12:00','Zelve Open Air Museum','Zelve 야외박물관','spot','암굴 주거지와 계곡.'],['12:20–13:30','Avanos Turkey','Avanos 점심','meal','현지식으로 간단히.'],['13:40–15:20','Avanos pottery workshop','Avanos 도자기 체험·산책','spot','키질르막 강과 도자기 공방.']]},{id:'C',name:'C 가볍게·카페',tag:'체력아끼기',items:[['09:30–10:45','Uçhisar Castle','우치히사르 전망','spot','짧고 선명한 전망 일정.'],['11:10–12:10','Göreme town center','괴레메 쇼핑·카페','rest','기념품·도자기·카페.'],['12:20–13:40','Dibek Restaurant Cappadocia','Dibek 점심','meal','괴레메 안에서 쉬기 좋은 점심 후보.'],['14:00–15:30','Aren Cave Goreme','호텔 복귀·휴식','rest','17:30 ATV 전에 충분히 쉬기.']] }]},ant:{name:'안탈리아 · 8/14 자유일',note:'확정 액티비티가 없는 경우를 위한 3가지 선택지입니다.',routes:[{id:'A',name:'A 칼레이치 중심',tag:'걷기 최소',items:[['09:00–10:00','Hadrian’s Gate Antalya','하드리아누스의 문','spot','Tuvana에서 가까운 구시가지 시작점.'],['10:10–11:20','Yivli Minare Mosque','이블리 미나레·칼레이치','spot','구시가지 골목 산책.'],['11:30–13:00','Antalya Old City Marina','마리나 + 점심','meal','바다 보며 점심.'],['16:00–18:00','Karaalioglu Park','카라알리오울루 공원','rest','한낮 호텔 휴식 후 늦은 오후 산책.']]},{id:'B',name:'B 바다·폭포',tag:'자연 중심',items:[['09:00–11:00','Lower Duden Waterfalls','Lower Düden 폭포','spot','바다로 떨어지는 폭포 풍경.'],['11:30–13:00','Lara Antalya','Lara 지역 점심','meal','폭포 이후 가까운 쪽에서 점심.'],['13:30–16:00','Tuvana Hotel Antalya','호텔 휴식','rest','가장 더운 시간 휴식.'],['16:30–18:30','Konyaalti Beach','Konyaaltı 해변','spot','저녁 무렵 바닷가 산책/수영 선택.']]},{id:'C',name:'C 유적·휴식',tag:'역사 좋아하면',items:[['08:30–10:30','Perge Ancient City','Perge 고대도시','spot','아침 일찍 유적 관람. 택시 이동 권장.'],['11:00–12:30','Antalya Kaleici','칼레이치 복귀·점심','meal','호텔 근처로 돌아와 식사.'],['13:00–16:00','Tuvana Hotel Antalya','호텔 수영·휴식','rest','한낮 휴식.'],['17:00–18:30','Hidirlik Tower Antalya','Hıdırlık Tower·해안','spot','일몰 전후 가벼운 산책.']] }]},ist:{name:'이스탄불 · 8/20 자유일',note:'8/19 술탄아흐멧 투어와 겹치지 않는 신시가지·보스포루스·아시아지구 선택지입니다.',routes:[{id:'A',name:'A 보스포루스',tag:'현재 추천',items:[['09:00–11:30','Dolmabahçe Palace','Dolmabahçe Palace','spot','보스포루스 궁전.'],['11:45–13:10','Beşiktaş Istanbul','Beşiktaş + 점심','meal','시장 주변 로칸타.'],['13:30–15:00','Ortaköy Mosque','Ortaköy','spot','모스크·해변 사진.'],['15:20–17:00','Bebek Istanbul','Bebek 카페·해안','rest','더운 오후를 카페 중심으로.']]},{id:'B',name:'B 갈라타·쇼핑',tag:'도시 분위기',items:[['09:30–11:00','Galata Tower','갈라타 주변','spot','탑 주변 골목·사진.'],['11:10–12:30','Karaköy Istanbul','Karaköy 카페','rest','카페 휴식.'],['13:00–14:00','Galataport Istanbul','Galataport 점심','meal','실내외 선택 쉬움.'],['16:30–19:00','Taksim Square','Taksim → İstiklal','spot','저녁 쇼핑·산책.']]},{id:'C',name:'C 아시아지구',tag:'현지 분위기',items:[['09:30–10:15','Eminonu Ferry Terminal','페리로 Kadıköy 이동','spot','보스포루스 풍경 포함 이동.'],['10:30–12:00','Kadikoy Market','Kadıköy 시장','spot','시장·골목 구경.'],['12:00–13:30','Ciya Sofrasi Kadikoy','Kadıköy 점심','meal','아나톨리아 음식 후보.'],['14:00–16:00','Moda Istanbul','Moda 산책·카페','rest','카페와 해안 산책 후 페리로 복귀.']] }]}};let currentCity=localStorage.getItem('tr26RecCity')||'capp',currentRoute=localStorage.getItem('tr26RecRoute')||'A';const enc=encodeURIComponent;function map(x){return 'https://www.google.com/maps/dir/?api=1&destination='+enc(x)}function search(x){return 'https://www.google.com/maps/search/?api=1&query='+enc(x)}function openRec(){document.getElementById('shade').classList.add('on');render()}function closeRec(){document.getElementById('shade').classList.remove('on')}function city(c){currentCity=c;currentRoute=localStorage.getItem('tr26Rec-'+c)||'A';localStorage.setItem('tr26RecCity',c);render()}function route(r){currentRoute=r;localStorage.setItem('tr26Rec-'+currentCity,r);render()}function choose(){localStorage.setItem('tr26ChosenRoute',currentCity+'|'+currentRoute);render()}function render(){Object.keys(R).forEach(c=>document.getElementById('c-'+c).classList.toggle('on',c===currentCity));let c=R[currentCity];document.getElementById('routes').innerHTML=c.routes.map(r=>`<button class="${r.id===currentRoute?'on':''}" onclick="route('${r.id}')">${r.name}</button>`).join('');let r=c.routes.find(x=>x.id===currentRoute),chosen=localStorage.getItem('tr26ChosenRoute')===currentCity+'|'+currentRoute;document.getElementById('content').innerHTML=`<div class="card hero"><div class="ey">${c.name}</div><div class="title">${r.name} · ${r.tag}</div><div class="sub">${c.note}</div><button class="save ${chosen?'saved':''}" onclick="choose()">${chosen?'✓ 이 코스로 선택됨':'이 코스로 선택'}</button></div>`+r.items.map(i=>`<div class="card ${i[3]}"><span class="badge">⭐추천</span> <span class="time">${i[0]}</span><div class="title">${i[2]}</div><div class="sub">${i[4]}</div><div class="btns"><a class="btn primary" target="_blank" href="${map(i[1])}">🗺️ 길찾기</a><a class="btn" target="_blank" href="${search(i[1])}">📍 장소보기</a></div></div>`).join('')}render();</script></body></html>
