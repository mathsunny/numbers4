<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>도쿄 여행 V4</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#23272f;background:#f7f8fa}.app{max-width:720px;margin:auto;padding:18px 16px 88px}.top h1{margin:0;font-size:27px}.top p{margin:6px 0 14px;color:#8a9098}.suica{background:linear-gradient(145deg,#1f2937,#475569);color:#fff;border-radius:20px;padding:17px;margin-bottom:14px}.suica small{opacity:.75}.suica b{display:block;font-size:32px;margin:4px 0}.warn{font-size:13px;color:#ffe082}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.tab{border:1px solid #e5e9ef;background:white;border-radius:14px;padding:11px 6px;font-weight:800}.tab.on{border:2px solid #2878ee;color:#2878ee}.section{display:none}.section.on{display:block}.card{background:#fff;border:1px solid #e5e9ef;border-radius:17px;padding:15px;margin-bottom:12px}.time{font-size:13px;color:#2878ee;font-weight:800}.title{font-size:18px;font-weight:900;margin-top:3px}.sub{color:#8c9299;font-size:14px;line-height:1.45;margin-top:5px}.route{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.route a{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:9px 5px;font-size:13px;font-weight:800;background:#eef2f6;color:#39424e}.route a:first-child{background:#2878ee;color:#fff}.head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}.head h2{font-size:20px;margin:0}.tag{display:inline-block;background:#eef4ff;color:#2878ee;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;margin-bottom:7px}.check{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.check input{width:20px;height:20px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fffffff2;border-top:1px solid #e5e7eb;padding:8px 4px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav{border:0;background:transparent;color:#92979f;font-size:10px}.nav b{display:block;font-size:20px}.nav.on{color:#2878ee}</style></head><body><div class="app"><header class="top"><h1>도쿄 여행 V4 🇯🇵</h1><p>최종 일정 · Google Maps 연동</p></header><div class="suica"><small>Suica 현재 잔액</small><b>¥494</b><div class="warn">지하철을 2회 이상 탈 경우 1,000엔 추가 충전을 권장합니다.</div></div><div class="tabs" id="tabs"></div><section id="schedule" class="section on"><div id="scheduleList"></div></section><section id="move" class="section"><div class="head"><h2>8/3 이동 비교</h2></div><div id="moveList"></div></section><section id="drug" class="section"><div class="head"><h2>드러그스토어</h2></div><div id="drugList"></div><div class="card"><span class="tag">구매 체크</span><label class="check"><input type="checkbox">선크림</label><label class="check"><input type="checkbox">립밤</label><label class="check"><input type="checkbox">간식</label><label class="check"><input type="checkbox">유모차</label></div></section><section id="food" class="section"><div class="head"><h2>니혼바시 점심</h2></div><div id="foodList"></div></section></div><nav class="bottom"><button class="nav on" data-page="schedule"><b>📅</b>일정</button><button class="nav" data-page="move"><b>🚇</b>이동</button><button class="nav" data-page="drug"><b>💊</b>드러그</button><button class="nav" data-page="food"><b>🍣</b>점심</button></nav><script>const days=[{label:'8/1',items:[['14:30','페어몬트 도쿄 체크인','짐 보관 및 객실 확인','Fairmont Tokyo'],['15:00','모리야 냉 붓카케 우동','점심 예약 불필요','Honkaku Teuchi Moriya Tokyo'],['16:15','센소지','가미나리몬·나카미세·문화관광센터 전망대','Sensoji Temple'],['19:30','Totsuji 저녁','호텔 철판요리','Totsuji Fairmont Tokyo'],['20:30','도쿄 스카이트리','야경 관람','Tokyo Skytree']]},{label:'8/2',items:[['07:30','호텔 조식','여유 있게 식사','Fairmont Tokyo'],['09:30','고카트','예약·국제운전면허증 확인','Street Kart Tokyo Bay'],['12:30','호카이반야 점심','해산물 점심','Hokkai Banya Tokyo'],['15:00','teamLab Borderless','아자부다이 힐스','teamLab Borderless Tokyo'],['18:00','호텔 복귀','수영장 또는 휴식','Fairmont Tokyo']]},{label:'8/3',items:[['09:30','호텔 출발 → 긴자','택시 10~15분 또는 지하철','Adidas Brand Center Ginza'],['09:45','긴자 카페·거리 산책','매장 오픈 대기','Ginza Tokyo'],['10:00','아디다스 브랜드 센터 긴자','10:00~10:55 쇼핑','Adidas Brand Center Ginza'],['11:00','Dover Street Market Ginza','꼼데가르송 쇼핑 · 11:00~12:30','Dover Street Market Ginza'],['12:30','긴자 → 니혼바시 미츠코시','택시 5~10분 또는 긴자선','Nihombashi Mitsukoshi Main Store'],['12:45','니혼바시 미츠코시 본점','신관 6층 유모차 구매·점심·휴식','Nihombashi Mitsukoshi Main Store'],['14:15','니혼바시 → 호텔','택시 15~20분 또는 지하철','Fairmont Tokyo'],['15:00','Fairmont Tokyo 도착','공항 샌딩 준비','Fairmont Tokyo']]}];const moves=[['호텔 → 긴자','택시 10~15분 · 지하철 25~35분 · IC 약 ¥180~220','Adidas Brand Center Ginza'],['긴자 → 니혼바시 미츠코시','택시 5~10분 · 긴자선 약 10분 · IC 약 ¥180','Nihombashi Mitsukoshi Main Store'],['니혼바시 → 호텔','택시 15~20분 · 지하철 25~35분 · IC 약 ¥180~220','Fairmont Tokyo']];const drugs=[['긴자 추천 1','Matsumoto Kiyoshi Ginza 5-chome','선크림·립밤·간식 모두 구입하기 편함'],['긴자 추천 2','SUNDRUG Ginza','가격 비교와 과자·생활용품 쇼핑에 좋음'],['니혼바시 추천','Tomod’s Nihombashi','미츠코시 쇼핑 후 호텔 복귀 전에 들르기 편함']];const foods=[['츠지한 니혼바시','해산물 덮밥 · 대기 가능'],['니혼바시 타마이','아나고 덮밥 · 비교적 담백함'],['카네코 한노스케','에도마에 텐동 · 든든한 선택']];let day=2;const gm=(p,m)=>`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p)}&travelmode=${m}`;function buttons(p){return `<div class="route"><a target="_blank" href="${gm(p,'transit')}">🚇 지하철</a><a target="_blank" href="${gm(p,'driving')}">🚕 택시</a><a target="_blank" href="${gm(p,'walking')}">🚶 도보</a></div>`}function renderTabs(){tabs.innerHTML=days.map((d,i)=>`<button class="tab ${i===day?'on':''}" data-day="${i}">${d.label}</button>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{day=+b.dataset.day;renderTabs();renderSchedule()}))}function renderSchedule(){scheduleList.innerHTML=days[day].items.map(x=>`<div class="card"><div class="time">${x[0]}</div><div class="title">${x[1]}</div><div class="sub">${x[2]}</div>${buttons(x[3])}</div>`).join('')}moveList.innerHTML=moves.map(x=>`<div class="card"><div class="title">${x[0]}</div><div class="sub">${x[1]}</div>${buttons(x[2])}</div>`).join('');drugList.innerHTML=drugs.map(x=>`<div class="card"><span class="tag">${x[0]}</span><div class="title">${x[1]}</div><div class="sub">${x[2]}</div>${buttons(x[1])}</div>`).join('');foodList.innerHTML=foods.map(x=>`<div class="card"><div class="title">${x[0]}</div><div class="sub">${x[1]}</div>${buttons(x[0])}</div>`).join('');document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',()=>{document.querySelectorAll('.nav,.section').forEach(x=>x.classList.remove('on'));n.classList.add('on');document.getElementById(n.dataset.page).classList.add('on');scrollTo(0,0)}));renderTabs();renderSchedule();</script></body></html>
