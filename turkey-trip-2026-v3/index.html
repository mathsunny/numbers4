[0]+'|'+x[1]+'|'+x[3]}function baseCard(x){let k=doneKey(x),d=S.done[k];return `<div class="card item ${d?'done':''}">${badge(x[2])}<span class="time">${x[1]}</span><div class="title">${x[3]}</div><div class="sub">${x[5]}</div>${x[5].includes('피켓')||x[5].includes('G55')?`<div class="note"><span class="badge pick">👤 픽업</span>${pickText()}</div>`:''}${outfit(x[6])}<div class="buttons"><a class="btn primary" target="_blank" href="${maps(x[4])}">🗺️ 길찾기</a><a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${E(x[4])}">📍 위치</a><button class="btn good" onclick="toggle('${esc(k)}')">${d?'✓ 완료':'✅ 완료'}</button></div></div>`}function extraCard(day,x){let k=day+'|'+x[0]+'|'+x[1],d=S.done[k],meal=x[1].includes('점심')||x[1].includes('저녁');return `<div class="card item ${meal?'meal':'route'} ${d?'done':''}"><span class="badge rec">⭐추천</span><span class="time">${x[0]}</span><div class="title">${x[1]}</div><div class="sub">${x[3]}</div>${outfit(x[4])}<div class="buttons"><a class="btn primary" target="_blank" href="${maps(x[2])}">🗺️ 길찾기</a><a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${E(x[2])}">📍 위치</a><button class="btn good" onclick="toggle('${esc(k)}')">${d?'✓ 완료':'✅ 완료'}</button></div>${day==='8/19'&&x[1].includes('오전 대표')?'<a class="btn purple" style="display:block;margin-top:8px" target="_blank" href="https://experiences.myrealtrip.com/products/4159276">🔗 오전투어 예약 링크</a>':''}${day==='8/19'&&x[1].includes('오후 미식')?'<a class="btn purple" style="display:block;margin-top:8px" target="_blank" href="https://experiences.myrealtrip.com/products/3436042">🔗 미식투어 예약 링크</a>':''}</div>`}function toggle(k){S.done[k]=!S.done[k];save();render()}function transitCard(){let t=S.transit,tm=t.fare*t.tomorrowTaps,rm=t.fare*t.remainingTaps,need=Math.max(0,rm-t.balance);return `<div class="card"><div class="title">🚇 Istanbulkart</div><div class="metricgrid"><div class="metric"><small>현재 잔액</small><b>${t.balance.toFixed(1)} TRY< n('')}`:''}`}function transport(){document.getElementById('transport').innerHTML=`<div class="card hero"><div class="ey">이동·픽업</div><div class="big">이름과 호텔을 헷갈리지 않게</div></div><div class="card profile"><div class="title">👤 픽업 보드 이름</div><div class="sub">${pickText()}<br>첨부자료는 달라만·카이세리 픽업에서 고객님의 영문 이름을 확인하도록 안내합니다.</div><button class="btn purple" onclick="openName()">영문명 ${S.englishName?'수정':'입력'}</button></div><div class="section">호텔 원문명</div>${Object.entries(H).map(([n,h])=>`<div class="card hotel"><span class="badge book">${h[1]}</span><div class="title">${n}</div><div class="sub">${h[0]}</div><a class="btn primary" style="display:block;margin-top:9px" target="_blank" href="${maps(n+' '+h[0])}">🗺️ 호텔 길찾기</a></div>`).join('')}<div class="section">픽업이 있는 일정</div>${base.filter(x=>x[5].includes('피켓')||x[5].includes('G55')||x[3].includes('픽업')).map(baseCard).join('')}`}function check(tab='packing'){document.getElementById('check').innerHTML=`<div class="card hero"><div class="ey">체크·쇼핑</div><div class="big">준비물을 놓치지 않게</div></div><div class="filters"><button class="${tab==='packing'?'on':''}" onclick="check('packing')">준비물</button><button class="${tab==='shop'?'on':''}" onclick="check('shop')">쇼핑</button></div>${tab==='packing'?`<div class="card">${master.map(n=>cb(n)).join('')}</div>`:`<div class="card">${shop.map((x,i)=>{let st=S.shop[i]||{};return `<div class="shop"><button class="star" onclick="wish(${i})">${st.wish?'⭐':'☆'}</button><div><b>${x[1]}</b><div class="sub">${x[0]} · ${x[2]}</div></div><button class="buy" onclick="bought(${i})">${st.bought?'완료':'구매'}</button></div>`}).join('')}</div>`}`}function cb(n){let k='p|'+n,o=S.checks[k];return `<label class="check ${o?'done':''}"><input type="checkbox" ${o?'checked':''} onchange="S.checks['${esc(k)}']=!S.checks['${esc(k)}'];save();check('packing')"><span>${n}</span></label>`}function wish(i){S.shop[i]=S.shop[i]||{};S.shop[i].wish=!S.shop[i].wish;save();check('shop')}function bought(i){S.shop[i]=S.shop[i]||{};S.shop[i].bought=!S.shop[i].bought;save();check('shop')}function tools(){let spent=S.expenses.reduce((a,e)=>a+e,0);document.getElementById('tools').innerHTML=`<div class="card hero"><div class="ey">여행도구</div><div class="big">픽업명 · 교통카드 · 예산</div></div><div class="card"><div class="title">👤 픽업 영문명</div><div class="sub">${S.englishName||'아직 입력하지 않음'}</div><button class="btn purple" onclick="openName()">입력/수정</button></div>${transitCard()}<div class="card"><div class="title">예산</div><div class="metricgrid"><div class="metric"><small>총예산</small><b>₩1,000,000</b></div><div class="metric"><small>사용액</small><b>₩${spent.toLocaleString()}</b></div><div class="metric"><small>남은예산</small><b>₩${(1000000-spent).toLocaleString()}</b></div><div class="metric"><small>별도현금</small><b>$500</b></div></div></div><div class="card"><div class="title">8/19 예약 링크</div><div class="buttons"><a class="btn primary" target="_blank" href="https://experiences.myrealtrip.com/products/4159276">오전 반일투어</a><a class="btn purple" target="_blank" href="https://experiences.myrealtrip.com/products/3436042">오후 미식투어</a><a class="btn" target="_blank" href="${maps('Basilica Cistern')}">예레바탄 지도</a></div></div>`}function openName(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="section">픽업 보드 영문명</div><div class="sub">여권과 항공권에 적힌 영문명을 그대로 입력하세요. 예: SURNAME GIVENNAME</div><div class="field"><label>장윤선 고객님 영문명</label><input id="ename" value="${S.englishName}"></div><button class="btn purple" style="width:100%;margin-top:10px" onclick="saveName()">저장</button>`;document.getElementById('modal').classList.add('on')}function saveName(){S.englishName=document.getElementById('ename').value.trim();save();closeModal();render()}function openTransit(){let t=S.transit;document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="section">Istanbulkart 잔액</div><div class="two"><div class="field"><label>현재 잔액 TRY</label><input id="bal" value="${t.balance}"></div><div class="field"><label>1회 기준 TRY</label><input id="fare" value="${t.fare}"></div></div><div class="two"><div class="field"><label>내일 예상 탑승</label><input id="tom" value="${t.tomorrowTaps}"></div><div class="field"><label>남은 일정 예상 탑승</label><input id="rem" value="${t.remainingTaps}"></div></div><button class="btn purple" style="width:100%;margin-top:10px" onclick="saveTransit()">저장</button><div class="buttons"><button class="btn good" onclick="topup(250)">+250 TRY</button><button class="btn good" onclick="topup(500)">+500 TRY</button><button class="btn" onclick="useFare(2)">2회 사용</button></div>`;document.getElementById('modal').classList.add('on')}function saveTransit(){let t=S.transit;t.balance=Number(document.getElementById('bal').value)||0;t.fare=Number(document.getElementById('fare').value)||t.fare;t.tomorrowTaps=Number(document.getElementById('tom').value)||0;t.remainingTaps=Number(document.getElementById('rem').value)||0;save();closeModal();render()}function topup(a){S.transit.balance+=a;save();openTransit();render()}function useFare(n){S.transit.balance=Math.max(0,S.transit.balance-S.transit.fare*n);save();render();if(document.getElementById('modal').classList.contains('on'))openTransit()}function openExpense(){let v=prompt('원화 기준 지출액을 입력하세요. 예: 15000','');if(v&&!isNaN(Number(v))){S.expenses.push(Number(v));save();render()}}function closeModal(){document.getElementById('modal').classList.remove('on')}function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));document.getElementById(v).classList.add('on');document.querySelectorAll('.bottom button').forEach(e=>e.classList.toggle('on',e.dataset.v===v));sessionStorage.setItem('v',v);render();scrollTo(0,0)}function render(){let v=sessionStorage.getItem('v')||'today';if(v==='today')today();if(v==='schedule')schedule();if(v==='transport')transport();if(v==='check')check();if(v==='tools')tools()}document.querySelectorAll('.bottom button').forEach(
