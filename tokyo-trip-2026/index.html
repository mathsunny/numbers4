<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><meta name="apple-mobile-web-app-capable" content="yes"><title>도쿄 여행</title><style>:root{--b:#2878ee;--g:#299c4b;--r:#ef476f;--ink:#24272b;--mut:#8d939b;--line:#e9edf2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--ink);background:#fff}button,input{font:inherit}.app{max-width:720px;margin:auto;padding-bottom:86px}.top{padding:calc(18px + env(safe-area-inset-top)) 18px 8px}.top h1{margin:0;font-size:26px}.top p{margin:5px 0;color:#999}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 18px}.day{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 6px;font-weight:800}.day small{display:block;color:#777;margin-top:4px}.day.on{border:2px solid var(--b);color:var(--b)}.page{display:none}.page.on{display:block}.sec{padding:12px 18px}.next{background:linear-gradient(145deg,#1f6fe5,#4f91f4);color:#fff;border-radius:20px;padding:17px;margin-bottom:18px}.next small{opacity:.82}.next h2{margin:6px 0 12px;font-size:23px}.ng{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ng div{background:#ffffff1d;border:1px solid #ffffff25;border-radius:13px;padding:10px}.ng b{display:block;margin-top:3px}.ok,.no{margin-top:12px;background:#fff;border-radius:12px;padding:10px;font-weight:800}.ok{color:#1e6d38}.no{color:var(--r)}.head{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.head h2{font-size:20px;margin:0}.timeline{position:relative;padding-left:31px}.timeline:before{content:"";position:absolute;left:12px;top:10px;bottom:8px;width:2px;background:#edf0f3}.stop{position:relative;margin-bottom:13px}.num{position:absolute;left:-31px;top:21px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#8854f6;color:#fff;font-weight:800}.card{border:1px solid var(--line);border-radius:17px;padding:15px;background:#fff;box-shadow:0 5px 18px #00000008}.card.done{opacity:.48}.card.done .title{text-decoration:line-through}.row{display:flex;justify-content:space-between;gap:9px}.title{font-size:18px;font-weight:800}.sub{font-size:14px;color:#969ba2;margin-top:5px;line-height:1.5}.pill{border:0;border-radius:99px;background:#edf7ef;color:var(--g);padding:7px 9px;font-weight:800}.fare{margin-top:11px;padding-top:10px;border-top:1px solid #eff1f3;display:flex;justify-content:space-between;font-size:14px}.fare b,.cost{color:var(--g);font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:10px;padding:9px 10px;background:var(--b);color:#fff;font-weight:800;text-decoration:none;display:inline-block}.btn.gray{background:#f1f3f5;color:#4a5056}.info{background:#f4f7ff;border-radius:14px;padding:13px;line-height:1.55;color:#566273;font-size:14px;margin-top:14px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:14px}.metric{text-align:center;padding:12px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric small{display:block;color:#888}.metric b{display:block;margin-top:5px}.route,.restaurant{border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:11px}.tag{display:inline-block;background:#eef4ff;color:var(--b);border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800;margin-bottom:7px}.restaurant h3{margin:0;font-size:18px}.field{width:100%;border:1px solid #dfe4ea;border-radius:11px;padding:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.check input{width:20px;height:20px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fffffff2;border-top:1px solid #eee;padding:8px 3px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav{border:0;background:transparent;color:#999;font-size:10px}.nav b{display:block;font-size:19px}.nav.on{color:var(--b)}</style></head><body><div class="app"><header class="top"><h1>도쿄 여행 🇯🇵</h1><p>2026.8.1–8.3 · 일본시간 기준</p></header><div class="days" id="tabs"></div><main id="schedule" class="page on"><section class="sec"><div class="next" id="next"></div><div class="head"><h2 id="dayTitle"></h2></div><div class="timeline" id="timeline"></div><div class="info">💡 교통비는 성인 1인 Suica 예상액입니다. 실제 경로와 출구는 ‘실시간 경로’에서 확인하세요.</div><div class="metrics"><div class="metric"><small>오늘 교통비</small><b id="fare"></b></div><div class="metric"><small>Suica 잔액</small><b id="bal"></b></div><div class="metric"><small>이동 후</small><b id="after"></b></div></div></section></main><main id="move" class="page"><section class="sec"><div class="head"><h2>구간별 이동</h2></div><div id="routes"></div></section></main><main id="food" class="page"><section class="sec"><div class="head"><h2>추천 식당</h2></div><div id="foods"></div></section></main><main id="wallet" class="page"><section class="sec"><div class="head"><h2>Suica 관리</h2></div><div class="card"><small>현재 잔액</small><h2 id="bigBal"></h2><div class="two"><input id="balInput" class="field" type="number"><button id="saveBal" class="btn">저장</button></div></div><div class="info">지하철 1회는 보통 약 ¥178~324입니다. 이번 일정은 공항 픽업·샌딩을 제외하고 1인 약 ¥2,000~3,000을 예상하면 됩니다.</div></section></main><main id="check" class="page"><section class="sec"><div class="head"><h2>준비 체크</h2></div><div class="card" id="checks"></div></section></main><nav class="bottom"><button class="nav on" data-page="schedule"><b>📅</b>일정</button><button class="nav" data-page="move"><b>🚆</b>이동</button><button class="nav" data-page="food"><b>🍽️</b>맛집</button><button class="nav" data-page="wallet"><b>💳</b>Suica</button><button class="nav" data-page="check"><b>✓</b>준비</button></nav></div><script>const days=[{date:'2026-08-01',label:'8/1 (토)',sum:'체크인·센소지',items:[['14:30','페어몬트 도쿄 체크인','짐 보관 및 객실 확인','Fairmont Tokyo',0,0],['15:00','모리야 냉 붓카케 우동','예약 불필요 · 냉 붓카케와 반숙계란튀김 추천','Honkaku Teuchi Moriya Tokyo',0,15],['16:15','센소지','다이몬역→아사쿠사역, 아사쿠사선 환승 없음','Sensoji Temple',220,35],['18:30','호텔 복귀','아사쿠사역→다이몬역 환승 없음','Fairmont Tokyo',220,35],['19:30','Totsuji 저녁','페어몬트 도쿄 철판요리 · 예약 확인','Totsuji Fairmont Tokyo',0,0],['21:00','도쿄 스카이트리','호텔→오시아게, 야경 관람','Tokyo Skytree',252,35],['22:30','호텔 복귀','오시아게→다이몬','Fairmont Tokyo',252,35]]},{date:'2026-08-02',label:'8/2 (일)',sum:'고카트·팀랩',items:[['07:30','호텔 조식','여유 있게 식사','Fairmont Tokyo',0,0],['08:40','호텔 출발','고카트 9:30 예약 · 30분 전 도착 권장','Street Kart Tokyo Bay',252,40],['09:30','고카트','예약 및 국제운전면허증 확인','Street Kart Tokyo Bay',0,0],['12:30','호카이반야 점심','해산물 점심 · 예약 여부 확인','Hokkai Banya Tokyo',252,35],['15:00','teamLab Borderless','아자부다이 힐스 · 입장시간 확인','teamLab Borderless Tokyo',178,25],['18:00','호텔 복귀','수영장 또는 휴식','Fairmont Tokyo',178,25]]},{date:'2026-08-03',label:'8/3 (월)',sum:'니혼바시 쇼핑',items:[['08:00','호텔 조식','체크아웃 준비','Fairmont Tokyo',0,0],['10:00','니혼바시 미츠코시 본점','쇼핑·식품관·선물','Nihombashi Mitsukoshi Main Store',209,25],['12:00','니혼바시 점심','츠지한·타마이·카네코한노스케 중 선택','Nihonbashi Tokyo',0,5],['13:30','호텔 복귀','샌딩 차량 탑승 준비','Fairmont Tokyo',209,25]]}];const foods=[{tag:'8/1 점심',n:'Honkaku Teuchi Moriya Tokyo',d:'냉 붓카케 우동 · 반숙계란튀김 추천 · 점심 예약 불필요',p:'Honkaku Teuchi Moriya Tokyo'},{tag:'8/1 저녁',n:'Totsuji',d:'페어몬트 도쿄 철판요리 · 예약 확인',p:'Totsuji Fairmont Tokyo'},{tag:'8/2 점심',n:'호카이반야',d:'해산물·게 요리 중심 점심',p:'Hokkai Banya Tokyo'},{tag:'8/3 점심 후보 1',n:'츠지한 니혼바시',d:'해산물 덮밥 · 인기 높아 대기 가능',p:'Tsujihan Nihonbashi'},{tag:'8/3 점심 후보 2',n:'니혼바시 타마이',d:'아나고 덮밥 · 비교적 담백한 선택',p:'Nihonbashi Tamai'},{tag:'8/3 점심 후보 3',n:'카네코한노스케',d:'에도마에 텐동 · 바삭하고 든든한 메뉴',p:'Kaneko Hannosuke Nihonbashi'}];let s=JSON.parse(localStorage.tokyoFinal||'{}');s.day=s.day||0;s.balance=s.balance??1000;s.done=s.done||{};s.check=s.check||{};const $=x=>document.getElementById(x),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),save=()=>localStorage.tokyoFinal=JSON.stringify(s);function list(di){return days[di].items.map((x,i)=>({id:`${di}-${i}`,t:x[0],n:x[1],d:x[2],p:x[3],fare:x[4],min:x[5]}))}function jpNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}))}function mins(date,time){const [y,m,d]=date.split('-').map(Number),[h,mi]=time.split(':').map(Number);return Math.round((new Date(y,m-1,d,h,mi)-jpNow())/60000)}function upcoming(){for(let di=0;di<days.length;di++)for(const x of list(di))if(!s.done[x.id]&&mins(days[di].date,x.t)>-90)return{di,x,m:mins(days[di].date,x.t)};return null}function tabs(){$('tabs').innerHTML=days.map((d,i)=>`<button class="day ${i===s.day?'on':''}" data-day="${i}">${d.label}<small>${d.sum}</small></button>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{s.day=+b.dataset.day;save();render()})}function render(){tabs();const u=upcoming();$('next').innerHTML=u?`<small>다음 일정 · ${days[u.di].label}</small><h2>${u.x.n}</h2><div class="ng"><div><small>출발까지</small><b>${Math.max(0,u.m)}분</b></div><div><small>이동</small><b>${u.x.min}분</b></div><div><small>IC 요금</small><b>${yen(u.x.fare)}</b></div></div><div class="${s.balance>=u.x.fare?'ok':'no'}">Suica ${yen(s.balance)} · ${s.balance>=u.x.fare?'잔액 충분':'충전 필요'}</div>`:'<small>다음 일정</small><h2>모든 일정 완료 🎉</h2>';const d=days[s.day],a=list(s.day);$('dayTitle').textContent=d.label+' 일정';$('timeline').innerHTML=a.map((x,i)=>`<div class="stop"><span class="num">${i+1}</span><div class="card ${s.done[x.id]?'done':''}"><div class="row"><div><div class="title">${x.n}</div><div class="sub">${x.t} · ${x.d}</div></div><button class="pill" data-done="${x.id}">${s.done[x.id]?'완료됨':'완료'}</button></div>${x.min?`<div class="fare"><span>🚆 약 ${x.min}분</span><b>${x.fare?yen(x.fare):'도보/예약'}</b></div>`:''}<div class="actions"><a class="btn" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(x.p)}&travelmode=transit">실시간 경로</a><a class="btn gray" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.p)}">지도</a></div></div></div>`).join('');document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{s.done[b.dataset.done]=!s.done[b.dataset.done];save();render()});const f=a.reduce((v,x)=>v+(s.done[x.id]?0:x.fare),0);$('fare').textContent=yen(f);$('bal').textContent=yen(s.balance);$('after').textContent=yen(Math.max(0,s.balance-f));$('bigBal').textContent=yen(s.balance);$('balInput').value=s.balance;$('routes').innerHTML=days.flatMap((d,di)=>list(di).filter(x=>x.min&&x.fare).map(x=>`<div class="route"><b>${d.label} · ${x.n}</b><span class="cost">${yen(x.fare)}</span><div class="sub">약 ${x.min}분 · IC 예상 운임</div><a class="btn" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(x.p)}&travelmode=transit">경로 보기</a></div>`)).join('');$('foods').innerHTML=foods.map(x=>`<div class="restaurant"><span class="tag">${x.tag}</span><h3>${x.n}</h3><div class="sub">${x.d}</div><div class="actions"><a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.p)}">지도</a></div></div>`).join('');const c=['여권','국제운전면허증','한국 운전면허증','고카트 예약','teamLab 티켓','Totsuji 예약','공항 픽업·샌딩','Suica 충전'];$('checks').innerHTML=c.map((x,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${s.check[i]?'checked':''}>${x}</label>`).join('');document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{s.check[c.dataset.check]=c.checked;save()})}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{document.querySelectorAll('.nav,.page').forEach(x=>x.classList.remove('on'));n.classList.add('on');$(n.dataset.page).classList.add('on');scrollTo(0,0)});$('saveBal').onclick=()=>{s.balance=Number($('balInput').value||0);save();render()};render();setInterval(render,60000);</script></body></html>
