<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><title>도쿄 여행</title><style>:root{--b:#2878ee;--g:#2b9b50;--r:#e84c6f;--ink:#24272b;--mut:#8d939b;--line:#e8ecf1;--bg:#f7f8fa}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}button,input{font:inherit}.app{max-width:720px;margin:auto;padding-bottom:88px}.top{padding:calc(18px + env(safe-area-inset-top)) 18px 10px}.top h1{margin:0;font-size:26px}.top p{margin:5px 0;color:#999}.wallet{margin:6px 18px 14px;padding:16px;border-radius:20px;background:linear-gradient(145deg,#1c2634,#394d66);color:#fff}.wallet small{opacity:.75}.wallet b{display:block;font-size:30px;margin-top:3px}.wallet .status{margin-top:8px;font-size:13px}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px 10px}.day{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px 5px;font-weight:800}.day small{display:block;color:#777;margin-top:4px}.day.on{border:2px solid var(--b);color:var(--b)}.page{display:none}.page.on{display:block}.sec{padding:12px 18px}.head{display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px}.head h2{font-size:20px;margin:0}.timeline{position:relative;padding-left:31px}.timeline:before{content:"";position:absolute;left:12px;top:10px;bottom:8px;width:2px;background:#edf0f3}.stop{position:relative;margin-bottom:13px}.num{position:absolute;left:-31px;top:21px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#8157f4;color:#fff;font-weight:800}.card{border:1px solid var(--line);border-radius:17px;padding:15px;background:#fff}.title{font-size:18px;font-weight:800}.sub{font-size:14px;color:#92979e;line-height:1.5;margin-top:5px}.routegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.routebtn{border:0;border-radius:11px;padding:9px 6px;text-decoration:none;text-align:center;font-weight:800;font-size:13px;background:#f1f4f7;color:#39424c}.routebtn.primary{background:var(--b);color:#fff}.fare{margin-top:9px;padding-top:9px;border-top:1px solid #eef0f3;font-size:13px;color:#5b6672}.tag{display:inline-block;background:#eef4ff;color:var(--b);border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800;margin-bottom:7px}.shop{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.shop input{width:20px;height:20px}.store{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px}.store h3{margin:0;font-size:17px}.info{background:#f4f7ff;border-radius:14px;padding:13px;line-height:1.55;color:#566273;font-size:14px;margin-top:13px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fffffff2;border-top:1px solid #eee;padding:8px 4px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav{border:0;background:transparent;color:#999;font-size:10px}.nav b{display:block;font-size:19px}.nav.on{color:var(--b)}</style></head><body><div class="app"><header class="top"><h1>도쿄 여행 🇯🇵</h1><p>2026.8.1–8.3 · 최종 일정</p></header><div class="wallet"><small>Suica 현재 잔액</small><b id="balance">¥494</b><div class="status" id="status">지하철 2회 이용 시 충전이 필요할 수 있습니다.</div></div><div class="days" id="tabs"></div><main id="schedule" class="page on"><section class="sec"><div class="head"><h2 id="dayTitle"></h2></div><div class="timeline" id="timeline"></div></section></main><main id="move" class="page"><section class="sec"><div class="head"><h2>8/3 이동 비교</h2></div><div id="moves"></div><div class="info">Google Maps 버튼은 현재 위치에서 목적지까지 대중교통·자동차·도보 모드로 바로 열립니다. 실제 열차와 요금은 출발 시각에 따라 달라질 수 있습니다.</div></section></main><main id="drug" class="page"><section class="sec"><div class="head"><h2>드러그스토어</h2></div><div id="stores"></div><div class="card"><span class="tag">구매 체크</span><div id="shopping"></div></div></section></main><main id="more" class="page"><section class="sec"><div class="head"><h2>점심·쇼핑</h2></div><div id="foods"></div></section></main><nav class="bottom"><button class="nav on" data-page="schedule"><b>📅</b>일정</button><button class="nav" data-page="move"><b>🚇</b>이동</button><button class="nav" data-page="drug"><b>💊</b>드러그</button><button class="nav" data-page="more"><b>🛍️</b>쇼핑</button></nav></div><script>const days=[{label:'8/1 (토)',sum:'센소지·스카이트리',items:[['14:30','페어몬트 도쿄 체크인','짐 보관 및 객실 확인','Fairmont Tokyo'],['15:00','모리야 냉 붓카케 우동','점심 예약 불필요','Honkaku Teuchi Moriya Tokyo'],['16:15','센소지','가미나리몬·나카미세·문화관광센터 전망대','Sensoji Temple'],['19:30','Totsuji 저녁','호텔 철판요리','Totsuji Fairmont Tokyo'],['20:30','도쿄 스카이트리','야경 관람','Tokyo Skytree']]},{label:'8/2 (일)',sum:'고카트·팀랩',items:[['07:30','호텔 조식','여유 있게 식사','Fairmont Tokyo'],['09:30','고카트','예약·국제운전면허증 확인','Street Kart Tokyo Bay'],['12:30','호카이반야 점심','해산물 점심','Hokkai Banya Tokyo'],['15:00','teamLab Borderless','아자부다이 힐스','teamLab Borderless Tokyo'],['18:00','호텔 복귀','수영장 또는 휴식','Fairmont Tokyo']]},{label:'8/3 (월)',sum:'긴자·니혼바시',items:[['09:30','호텔 출발 → 긴자','택시 10~15분 또는 지하철','Adidas Brand Center Ginza'],['09:45','긴자 카페·거리 산책','매장 오픈 대기','Ginza Tokyo'],['10:00','아디다스 브랜드 센터 긴자','10:00~10:55 쇼핑','Adidas Brand Center Ginza'],['11:00','Dover Street Market Ginza','꼼데가르송 쇼핑 · 11:00~12:30','Dover Street Market Ginza'],['12:30','긴자 → 니혼바시 미츠코시','택시 5~10분 또는 긴자선','Nihombashi Mitsukoshi Main Store'],['12:45','니혼바시 미츠코시 본점','신관 6층 유모차 구매·점심·휴식','Nihombashi Mitsukoshi Main Store'],['14:15','니혼바시 → 호텔','택시 15~20분 또는 지하철','Fairmont Tokyo'],['15:00','Fairmont Tokyo 도착','공항 샌딩 준비','Fairmont Tokyo']]}];const moves=[{n:'호텔 → 긴자',d:'택시 약 10~15분 · 지하철 약 25~35분',p:'Adidas Brand Center Ginza',fare:'IC 약 ¥180~¥220'},{n:'긴자 → 니혼바시 미츠코시',d:'택시 약 5~10분 · 긴자선 약 10분',p:'Nihombashi Mitsukoshi Main Store',fare:'IC 약 ¥180'},{n:'니혼바시 → 호텔',d:'택시 약 15~20분 · 지하철 약 25~35분',p:'Fairmont Tokyo',fare:'IC 약 ¥180~¥220'}];const stores=[{tag:'긴자 추천 1',n:'Matsumoto Kiyoshi Ginza 5-chome',d:'선크림·립밤·간식 모두 구입하기 편함',p:'Matsumoto Kiyoshi Ginza 5-chome'},{tag:'긴자 추천 2',n:'SUNDRUG Ginza',d:'가격 비교와 과자·생활용품 쇼핑에 좋음',p:'SUNDRUG Ginza'},{tag:'니혼바시 추천',n:'Tomod’s Nihombashi',d:'미츠코시 쇼핑 후 호텔 복귀 전에 들르기 편함',p:'Tomods Nihombashi'}];const foods=[{tag:'니혼바시 점심 1',n:'츠지한 니혼바시',d:'해산물 덮밥 · 대기 가능',p:'Tsujihan Nihonbashi'},{tag:'니혼바시 점심 2',n:'니혼바시 타마이',d:'아나고 덮밥 · 비교적 담백함',p:'Nihonbashi Tamai'},{tag:'니혼바시 점심 3',n:'카네코 한노스케',d:'에도마에 텐동 · 든든한 선택',p:'Kaneko Hannosuke Nihonbashi'}];let state=JSON.parse(localStorage.tokyoV4||'{}');state.day=state.day??2;state.balance=state.balance??494;state.buy=state.buy||{};const $=x=>document.getElementById(x),save=()=>localStorage.tokyoV4=JSON.stringify(state),gm=(p,m)=>`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p)}&travelmode=${m}`;function tabs(){$('tabs').innerHTML=days.map((d,i)=>`<button class="day ${i===state.day?'on':''}" data-day="${i}">${d.label}<small>${d.sum}</small></button>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{state.day=+b.dataset.day;save();render()}))}function card(x,i){return `<div class="stop"><span class="num">${i+1}</span><div class="card"><div class="title">${x[1]}</div><div class="sub">${x[0]} · ${x[2]}</div><div class="routegrid"><a class="routebtn primary" target="_blank" href="${gm(x[3],'transit')}">🚇 지하철</a><a class="routebtn" target="_blank" href="${gm(x[3],'driving')}">🚕 택시</a><a class="routebtn" target="_blank" href="${gm(x[3],'walking')}">🚶 도보</a></div></div></div>`}function render(){tabs();$('balance').textContent='¥'+state.balance.toLocaleString('ja-JP');$('status').textContent=state.balance<600?'지하철 이동이 2회 이상이면 1,000엔 추가 충전을 권장합니다.':'오늘 지하철 이동에 사용할 수 있는 잔액입니다.';const d=days[state.day];$('dayTitle').textContent=d.label+' 일정';$('timeline').innerHTML=d.items.map(card).join('');$('moves').innerHTML=moves.map(x=>`<div class="store"><span class="tag">${x.fare}</span><h3>${x.n}</h3><div class="sub">${x.d}</div><div class="routegrid"><a class="routebtn primary" target="_blank" href="${gm(x.p,'transit')}">🚇 Google 지도</a><a class="routebtn" target="_blank" href="${gm(x.p,'driving')}">🚕 택시 경로</a><a class="routebtn" target="_blank" href="${gm(x.p,'walking')}">🚶 도보 경로</a></div></div>`).join('');$('stores').innerHTML=stores.map(x=>`<div class="store"><span class="tag">${x.tag}</span><h3>${x.n}</h3><div class="sub">${x.d}</div><div class="routegrid"><a class="routebtn primary" target="_blank" href="${gm(x.p,'transit')}">🚇 지하철</a><a class="routebtn" target="_blank" href="${gm(x.p,'walking')}">🚶 도보</a><a class="routebtn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.p)}">📍 지도</a></div></div>`).join('');const buy=['선크림','립밤','간식','유모차'];$('shopping').innerHTML=buy.map((x,i)=>`<label class="shop"><input type="checkbox" data-buy="${i}" ${state.buy[i]?'checked':''}>${x}</label>`).join('');document.querySelectorAll('[data-buy]').forEach(c=>c.addEventListener('change',()=>{state.buy[c.dataset.buy]=c.checked;save()}));$('foods').innerHTML=foods.map(x=>`<div class="store"><span class="tag">${x.tag}</span><h3>${x.n}</h3><div class="sub">${x.d}</div><div class="routegrid"><a class="routebtn primary" target="_blank" href="${gm(x.p,'transit')}">🚇 지하철</a><a class="routebtn" target="_blank" href="${gm(x.p,'walking')}">🚶 도보</a><a class="routebtn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.p)}">📍 지도</a></div></div>`).join('')}document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',()=>{document.querySelectorAll('.nav,.page').forEach(x=>x.classList.remove('on'));n.classList.add('on');$(n.dataset.page).classList.add('on');scrollTo(0,0)}));render();</script></body></html>
