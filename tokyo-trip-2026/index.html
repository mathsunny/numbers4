<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><title>도쿄 여행</title><style>:root{--blue:#2878ee;--ink:#24272b;--mut:#92979d;--line:#e9edf2;--green:#299c4b;--red:#ef476f;--bg:#f7f8fa}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--ink);background:#fff}button,input,select{font:inherit}.app{max-width:720px;margin:auto;padding-bottom:84px}.top{padding:calc(18px + env(safe-area-inset-top)) 18px 8px}.top h1{margin:0;font-size:26px}.top p{margin:4px 0;color:#999}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 18px}.day{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 7px;font-weight:800}.day small{display:block;color:#777;margin-top:4px}.day.on{border:2px solid var(--blue);color:var(--blue)}.page{display:none}.page.on{display:block}.sec{padding:12px 18px}.next{background:linear-gradient(145deg,#1f6fe5,#4f91f4);color:#fff;border-radius:20px;padding:17px;margin:4px 0 18px}.next small{opacity:.8}.next h2{margin:6px 0 12px;font-size:23px}.nextgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nextgrid div{background:#ffffff1d;border:1px solid #ffffff25;border-radius:13px;padding:10px}.nextgrid b{display:block;font-size:17px;margin-top:3px}.safe{margin-top:12px;background:#fff;color:#1e6d38;border-radius:12px;padding:10px;font-weight:800}.unsafe{margin-top:12px;background:#fff;color:var(--red);border-radius:12px;padding:10px;font-weight:800}.head{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.head h2{font-size:20px;margin:0}.add{border:0;border-radius:99px;background:#eef4ff;color:var(--blue);padding:8px 12px;font-weight:800}.timeline{position:relative;padding-left:31px}.timeline:before{content:"";position:absolute;left:12px;top:10px;bottom:8px;width:2px;background:#edf0f3}.stop{position:relative;margin-bottom:13px}.num{position:absolute;left:-31px;top:21px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#8854f6;color:#fff;font-weight:800}.card{border:1px solid var(--line);border-radius:17px;padding:15px;background:#fff;box-shadow:0 5px 18px #00000008}.card.done{opacity:.48}.card.done .title{text-decoration:line-through}.row{display:flex;justify-content:space-between;gap:9px}.title{font-size:18px;font-weight:800}.sub{font-size:14px;color:#989ca2;margin-top:5px;line-height:1.45}.pill{border:0;border-radius:99px;background:#edf7ef;color:var(--green);padding:7px 9px;font-weight:800}.fare{margin-top:11px;padding-top:10px;border-top:1px solid #eff1f3;display:flex;justify-content:space-between;font-size:14px}.fare b{color:var(--green)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:10px;padding:9px 10px;background:var(--blue);color:#fff;font-weight:800;text-decoration:none}.btn.gray{background:#f1f3f5;color:#4a5056}.btn.red{background:#fff0f3;color:var(--red)}.info{background:#f4f7ff;border-radius:14px;padding:13px;line-height:1.55;color:#566273;font-size:14px;margin-top:14px}.suica{border:1px solid var(--line);border-radius:18px;padding:16px;margin:15px 0}.balance{font-size:27px;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:14px}.metric{text-align:center;padding:12px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric small{display:block;color:#888}.metric b{display:block;margin-top:5px}.route{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px}.cost{float:right;color:var(--green);font-weight:900}.field{width:100%;border:1px solid #dfe4ea;border-radius:11px;padding:11px;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form{display:grid;gap:8px;margin-top:10px}.check{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.check input{width:20px;height:20px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fffffff2;border-top:1px solid #eee;padding:8px 5px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav{border:0;background:transparent;color:#999;font-size:11px}.nav b{display:block;font-size:20px}.nav.on{color:var(--blue)}dialog{border:0;border-radius:18px;width:min(92%,480px);padding:18px}dialog::backdrop{background:#0005}</style></head><body><div class="app"><header class="top"><h1>도쿄 여행 🇯🇵</h1><p>2026.8.1 - 8.3 · 일본시간 기준</p></header><div class="days" id="tabs"></div><main id="schedule" class="page on"><section class="sec"><div class="next" id="nextCard"></div><div class="head"><h2 id="dayTitle"></h2><button class="add" id="addBtn">＋ 일정 추가</button></div><div class="timeline" id="timeline"></div><div class="info">💡 예상 운임은 성인 1인 IC카드 기준입니다. 실제 운임과 열차 시간, 승강장·출구는 각 일정의 ‘실시간 경로’에서 확인하세요.</div><div class="metrics"><div class="metric"><small>오늘 교통비</small><b id="dayFare"></b></div><div class="metric"><small>Suica 잔액</small><b id="bal"></b></div><div class="metric"><small>이동 후 잔액</small><b id="after"></b></div></div></section></main><main id="move" class="page"><section class="sec"><div class="head"><h2>구간별 이동</h2></div><div id="routes"></div></section></main><main id="wallet" class="page"><section class="sec"><div class="head"><h2>Suica 관리</h2></div><div class="suica"><small>현재 잔액</small><div class="balance" id="bigBal"></div><div class="two" style="margin-top:12px"><input id="balInput" class="field" type="number"><button id="saveBal" class="btn">저장</button></div></div><div class="card"><b>충전 기준</b><p class="sub">지하철 1회는 보통 약 ¥178~324입니다. 하루 관광 전에는 당일 예상 교통비에 ¥1,000을 더한 금액, 최소 ¥3,000 이상을 권장합니다.</p></div></section></main><main id="check" class="page"><section class="sec"><div class="head"><h2>준비 체크</h2></div><div class="card" id="checks"></div></section></main><nav class="bottom"><button class="nav on" data-page="schedule"><b>📅</b>일정</button><button class="nav" data-page="move"><b>🚆</b>이동</button><button class="nav" data-page="wallet"><b>💳</b>Suica</button><button class="nav" data-page="check"><b>✓</b>준비</button></nav></div><dialog id="dlg"><h3>일정 추가</h3><div class="form"><input id="newTime" class="field" type="time"><input id="newName" class="field" placeholder="장소 또는 일정"><input id="newPlace" class="field" placeholder="지도 검색어"><div class="two"><input id="newFare" class="field" type="number" placeholder="예상 IC요금"><input id="newMin" class="field" type="number" placeholder="이동시간(분)"></div><button id="saveNew" class="btn">추가</button><button id="closeDlg" class="btn gray">취소</button></div></dialog><script>const base=[{date:'2026-08-01',label:'8/1 (토)',sum:'입국·호텔',items:[['12:30','나리타 국제공항 도착','픽업 차량 예약 완료','Narita International Airport',0,70],['14:30','페어몬트 도쿄 체크인','휴식 또는 수영장','Fairmont Tokyo',0,0]]},{date:'2026-08-02',label:'8/2 (일)',sum:'핵심 일정',items:[['09:00','페어몬트 도쿄 출발','하마마쓰초역 이동','Fairmont Tokyo',0,0],['10:00','마리오 카트','Street Kart Tokyo Bay · 30분 전 도착','Street Kart Tokyo Bay',252,40],['12:30','돈키호테','쇼핑 · 운영시간 확인','Don Quijote Ginza Honkan',252,35],['14:30','팀랩 보더리스','아자부다이 힐스','teamLab Borderless Tokyo',178,20],['17:00','센소지','아사쿠사 관광','Sensoji Temple',252,30],['18:30','호카이안야','저녁 식사','Hokkaianoya Tokyo',178,25],['20:00','도쿄 스카이트리','전망대','Tokyo Skytree',209,25],['22:00','페어몬트 도쿄 복귀','호텔 휴식','Fairmont Tokyo',252,35]]},{date:'2026-08-03',label:'8/3 (월)',sum:'쇼핑·공항',items:[['08:00','호텔 조식','체크아웃 준비','Fairmont Tokyo',0,0],['10:00','긴자 쇼핑','유니클로·로프트·선물','Ginza Tokyo',178,15],['12:30','점심','공항 이동 전 식사','Tokyo Station',178,20],['14:30','호텔 샌딩 · 공항 이동','예약 차량 탑승','Fairmont Tokyo',0,70]]}];let s=JSON.parse(localStorage.tokyoV3||'{}');s.day=s.day||0;s.balance=s.balance??5000;s.done=s.done||{};s.extra=s.extra||{};s.check=s.check||{};const $=id=>document.getElementById(id),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),save=()=>localStorage.tokyoV3=JSON.stringify(s);function items(di){let a=base[di].items.map((x,i)=>({id:`b${di}-${i}`,t:x[0],n:x[1],d:x[2],p:x[3],fare:x[4],min:x[5],custom:false}));return a.concat(s.extra[di]||[]).sort((a,b)=>a.t.localeCompare(b.t))}function jpNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}))}function minutesUntil(date,time){const [y,m,d]=date.split('-').map(Number),[h,mi]=time.split(':').map(Number);return Math.round((new Date(y,m-1,d,h,mi)-jpNow())/60000)}function nextItem(){for(let di=0;di<base.length;di++){for(const x of items(di)){if(!s.done[x.id]&&minutesUntil(base[di].date,x.t)>-90)return{di,x,mins:minutesUntil(base[di].date,x.t)}}}return null}function tabs(){$('tabs').innerHTML=base.map((d,i)=>`<button class="day ${s.day===i?'on':''}" data-day="${i}">${d.label}<small>${d.sum}</small></button>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{s.day=+b.dataset.day;save();render()})}function nextCard(){const n=nextItem();if(!n){$('nextCard').innerHTML='<small>다음 일정</small><h2>모든 일정이 완료되었습니다 🎉</h2>';return}const depart=new Date(jpNow().getTime()+Math.max(0,n.mins-n.x.min)*60000);const enough=s.balance>=n.x.fare;const remain=Math.max(0,n.mins);$('nextCard').innerHTML=`<small>다음 일정 · ${base[n.di].label}</small><h2>${n.x.n}</h2><div class="nextgrid"><div><small>출발까지</small><b>${remain>60?Math.floor(remain/60)+'시간 '+remain%60+'분':remain+'분'}</b></div><div><small>예상 이동</small><b>${n.x.min||0}분</b></div><div><small>IC 요금</small><b>${yen(n.x.fare)}</b></div></div><div class="${enough?'safe':'unsafe'}">현재 Suica ${yen(s.balance)} · ${enough?'잔액이 충분합니다':'충전이 필요합니다'}</div>`}function render(){tabs();nextCard();const d=base[s.day],list=items(s.day);$('dayTitle').textContent=d.label+' 일정';$('timeline').innerHTML=list.map((x,i)=>`<div class="stop"><span class="num">${i+1}</span><div class="card ${s.done[x.id]?'done':''}"><div class="row"><div><div class="title">${x.n}</div><div class="sub">${x.t} · ${x.d}</div></div><button class="pill" data-done="${x.id}">${s.done[x.id]?'완료됨':'완료'}</button></div>${x.min?`<div class="fare"><span>🚆 약 ${x.min}분</span><b>예상 ${yen(x.fare)}</b></div>`:''}<div class="actions"><a class="btn" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(x.p)}&travelmode=transit">실시간 경로</a><a class="btn gray" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.p)}">지도</a>${x.custom?`<button class="btn red" data-del="${x.id}">삭제</button>`:''}</div></div></div>`).join('');document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{s.done[b.dataset.done]=!s.done[b.dataset.done];save();render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{s.extra[s.day]=(s.extra[s.day]||[]).filter(x=>x.id!==b.dataset.del);save();render()});const fare=list.reduce((a,x)=>a+(s.done[x.id]?0:x.fare),0);$('dayFare').textContent=yen(fare);$('bal').textContent=yen(s.balance);$('after').textContent=yen(Math.max(0,s.balance-fare));$('bigBal').textContent=yen(s.balance);$('balInput').value=s.balance;$('routes').innerHTML=base.flatMap((d,di)=>items(di).filter(x=>x.min).map(x=>`<div class="route"><b>${d.label} · ${x.n}</b><span class="cost">${yen(x.fare)}</span><div class="sub">약 ${x.min}분 · IC카드 예상 운임</div><a class="btn" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(x.p)}&travelmode=transit">Google Maps 경로</a></div>`)).join('');const c=['여권','국제운전면허증','한국 운전면허증','마리오카트 예약 확인','teamLab 티켓','스카이트리 예약 확인','공항 픽업·샌딩 확인','Suica 충전'];$('checks').innerHTML=c.map((x,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${s.check[i]?'checked':''}>${x}</label>`).join('');document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{s.check[c.dataset.check]=c.checked;save()})}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{document.querySelectorAll('.nav,.page').forEach(x=>x.classList.remove('on'));n.classList.add('on');$(n.dataset.page).classList.add('on');scrollTo(0,0)});$('saveBal').onclick=()=>{s.balance=Number($('balInput').value||0);save();render()};$('addBtn').onclick=()=>$('dlg').showModal();$('closeDlg').onclick=()=>$('dlg').close();$('saveNew').onclick=()=>{const t=$('newTime').value,n=$('newName').value.trim();if(!t||!n)return;const x={id:'x'+Date.now(),t,n,d:'사용자 추가 일정',p:$('newPlace').value||n,fare:Number($('newFare').value||0),min:Number($('newMin').value||0),custom:true};s.extra[s.day]=s.extra[s.day]||[];s.extra[s.day].push(x);save();$('dlg').close();['newTime','newName','newPlace','newFare','newMin'].forEach(id=>$(id).value='');render()};render();setInterval(nextCard,60000);</script></body></html>
